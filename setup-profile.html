<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Complete Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035",
      measurementId: "G-N8L551KYDP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
      } else {
        window.location.href = "login.html";
      }
    });

    window.saveProfile = async () => {
      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim();
      const dob = document.getElementById('dob').value;

      if (!fullName || !username || !dob) {
        alert("Please fill in all fields!");
        return;
      }

      try {
        await setDoc(doc(db, "users", currentUser.uid), {
          uid: currentUser.uid,
          fullName: fullName,
          username: username.toLowerCase(),
          dob: dob,
          email: currentUser.email || "",
          phone: currentUser.phoneNumber || "",
          createdAt: new Date()
        });

        alert("Profile Setup Complete!");
        window.location.href = "index.html";
      } catch (error) {
        alert("Error saving profile: " + error.message);
      }
    };
  </script>
</head>
<body class="bg-black text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">

  <div class="w-full max-w-md bg-[#121212] border border-neutral-800 rounded-3xl p-8 space-y-6 shadow-2xl">
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold text-white">Setup Your Profile</h1>
      <p class="text-xs text-neutral-400">Enter your details to finish setting up PulseIn</p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-[11px] text-neutral-400 mb-1 block">Full Name</label>
        <input type="text" id="fullName" placeholder="e.g. Oronno Broh" class="w-full bg-black border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
      </div>

      <div>
        <label class="text-[11px] text-neutral-400 mb-1 block">Username</label>
        <div class="flex items-center bg-black border border-neutral-800 rounded-xl px-3 py-2.5">
          <span class="text-xs text-neutral-500 mr-1">@</span>
          <input type="text" id="username" placeholder="oron.broh" class="bg-transparent text-xs text-white focus:outline-none flex-1">
        </div>
      </div>

      <div>
        <label class="text-[11px] text-neutral-400 mb-1 block">Date of Birth</label>
        <input type="date" id="dob" class="w-full bg-black border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
      </div>

      <button onclick="saveProfile()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded-xl text-xs transition mt-2">
        Save & Continue
      </button>
    </div>
  </div>

</body>
</html>
