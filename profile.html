<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Profile — PulseIn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-black text-slate-100 min-h-screen flex font-sans">

  <!-- SIDEBAR -->
  <aside class="w-20 lg:w-64 border-r border-slate-800 p-4 flex flex-col justify-between">
    <a href="index.html" class="flex items-center space-x-3 text-cyan-400 px-2">
      <i class="fa-solid fa-bolt text-2xl"></i>
      <span class="hidden lg:inline text-xl font-bold text-white">PulseIn</span>
    </a>
  </aside>

  <!-- PROFILE CONTENT -->
  <main class="flex-1 max-w-4xl mx-auto p-6 space-y-8">

    <!-- Profile Header Info -->
    <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
      
      <!-- Profile Picture with NOTE BUBBLE (Exact 3rd Image Match) -->
      <div class="relative">
        <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded-full text-[10px] text-slate-300 flex items-center space-x-1 shadow-lg">
          <span>Note..</span><i class="fa-solid fa-arrows-up-down text-[8px]"></i>
        </div>
        <img src="https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=200" class="w-32 h-32 rounded-full object-cover border-2 border-slate-700">
      </div>

      <!-- Bio & Details Section -->
      <div class="space-y-4 flex-1 text-center md:text-left">
        <div class="flex flex-col md:flex-row md:items-center gap-4">
          <h2 class="text-xl font-bold">oron.broh</h2>
          <div class="flex space-x-2">
            <button class="bg-slate-800 hover:bg-slate-700 font-semibold px-4 py-1.5 rounded-xl text-xs">Edit profile</button>
            <button class="bg-slate-800 hover:bg-slate-700 font-semibold px-4 py-1.5 rounded-xl text-xs">View archive</button>
          </div>
        </div>

        <!-- Stats -->
        <div class="flex justify-center md:justify-start space-x-8 text-xs">
          <span><strong class="text-white">26</strong> posts</span>
          <span><strong class="text-white">64</strong> followers</span>
          <span><strong class="text-white">54</strong> following</span>
        </div>

        <!-- Bio Text -->
        <div class="text-xs space-y-1 text-slate-300 font-medium">
          <p class="font-bold text-white">Oronno 🦊 ele</p>
          <p>Back?? 😫</p>
          <p>Topup Acc -/ <span class="text-cyan-400">@orannotopup</span></p>
          <p>Astronomy is fvrt 🔭 369 🌌 🪐</p>
          <p class="text-cyan-400 hover:underline cursor-pointer"><i class="fa-solid fa-link text-[10px]"></i> oronnotopup.vercel.app and 4 more</p>
          <span class="inline-block bg-slate-900 border border-slate-800 px-2 py-0.5 rounded-md text-[10px] font-mono mt-1">@100M+</span>
        </div>
      </div>
    </div>

    <!-- STORY HIGHLIGHTS -->
    <div class="flex space-x-6 overflow-x-auto pb-4 border-b border-slate-800">
      <div class="text-center flex-shrink-0"><div class="w-16 h-16 rounded-full border border-slate-700 p-0.5"><img src="https://i.pravatar.cc/100?img=11" class="w-full h-full rounded-full object-cover"></div><span class="text-[10px] text-slate-400 mt-1 block">España 🇪🇸</span></div>
      <div class="text-center flex-shrink-0"><div class="w-16 h-16 rounded-full border border-slate-700 p-0.5"><img src="https://i.pravatar.cc/100?img=15" class="w-full h-full rounded-full object-cover"></div><span class="text-[10px] text-slate-400 mt-1 block">Sky</span></div>
      <div class="text-center flex-shrink-0"><div class="w-16 h-16 rounded-full border border-slate-700 p-0.5"><img src="https://i.pravatar.cc/100?img=20" class="w-full h-full rounded-full object-cover"></div><span class="text-[10px] text-slate-400 mt-1 block">Siuuu</span></div>
    </div>

    <!-- POST TABS -->
    <div class="flex justify-center space-x-12 border-t border-slate-800 text-xs font-bold text-slate-400 -mt-4">
      <button class="py-3 text-cyan-400 border-t-2 border-cyan-400"><i class="fa-solid fa-table-cells mr-2"></i>POSTS</button>
      <button class="py-3 hover:text-white"><i class="fa-solid fa-clapperboard mr-2"></i>REELS</button>
      <button class="py-3 hover:text-white"><i class="fa-regular fa-bookmark mr-2"></i>SAVED</button>
    </div>

  </main>
</body>
</html>
