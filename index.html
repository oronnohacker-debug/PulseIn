<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Connect the Pulse</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex antialiased selection:bg-cyan-500 selection:text-black">

  <!-- AUTH MODAL -->
  <div id="authOverlay" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-cyan-500/20 rounded-full blur-2xl"></div>
      <h1 class="text-3xl font-black text-center bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent mb-2">PulseIn</h1>
      <p class="text-xs text-center text-slate-400 mb-6">Enter the next-gen social network</p>
      
      <form id="authForm" class="space-y-4">
        <div id="nameField" class="hidden">
          <input type="text" id="authName" class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="Full Name">
        </div>
        <div>
          <input type="email" id="authEmail" required class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="Email Address">
        </div>
        <div>
          <input type="password" id="authPassword" required class="w-full bg-slate-800/60 border border-slate-700/80 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition" placeholder="Password">
        </div>
        <button type="submit" id="authBtn" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-bold py-3 rounded-xl hover:opacity-90 transition">Log In</button>
      </form>
      
      <p class="text-center text-xs text-slate-400 mt-6">
        <span id="toggleText">Don't have an account?</span>
        <button id="toggleAuthBtn" class="text-cyan-400 font-bold ml-1 hover:underline">Sign Up</button>
      </p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="hidden flex w-full min-h-screen">

    <!-- LEFT SIDEBAR -->
    <aside class="w-20 xl:w-64 border-r border-slate-800/80 p-4 flex flex-col justify-between h-screen sticky top-0 bg-slate-950/60 backdrop-blur-lg z-40">
      <div class="space-y-8">
        <div class="px-2 pt-2 flex items-center space-x-3">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-400 to-blue-600 flex items-center justify-center font-black text-black">P</div>
          <span class="hidden xl:inline text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">PulseIn</span>
        </div>

        <nav class="space-y-1">
          <button onclick="switchTab('feed')" class="nav-item active w-full flex items-center space-x-4 p-3 rounded-xl text-slate-300 hover:bg-slate-900 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="hidden xl:inline text-sm font-semibold">Feed</span>
          </button>
          <button onclick="switchTab('messages')" class="nav-item w-full flex items-center space-x-4 p-3 rounded-xl text-slate-400 hover:bg-slate-900 transition relative">
            <i class="fa-solid fa-paper-plane text-lg"></i>
            <span class="hidden xl:inline text-sm font-semibold">Messages</span>
          </button>
          <button onclick="switchTab('notifications')" class="nav-item w-full flex items-center space-x-4 p-3 rounded-xl text-slate-400 hover:bg-slate-900 transition">
            <i class="fa-solid fa-bell text-lg"></i>
            <span class="hidden xl:inline text-sm font-semibold">Notifications</span>
          </button>
        </nav>
      </div>

      <div class="border-t border-slate-800/80 pt-4">
        <div class="flex items-center justify-between p-2">
          <div class="flex items-center space-x-3">
            <div id="userAvatar" class="w-9 h-9 rounded-full bg-cyan-500 text-black font-bold flex items-center justify-center text-sm">U</div>
            <div class="hidden xl:block">
              <p id="userNameDisplay" class="text-xs font-bold truncate max-w-[110px]"></p>
              <p class="text-[10px] text-cyan-400">Pro Member</p>
            </div>
          </div>
          <button id="logoutBtn" class="text-slate-500 hover:text-red-400 text-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </aside>

    <!-- CONTENT AREA -->
    <main class="flex-1 max-w-4xl mx-auto px-4 py-6">
      
      <!-- FEED TAB -->
      <div id="tab-feed" class="space-y-6">
        <!-- CREATE POST -->
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 backdrop-blur-sm">
          <textarea id="postText" rows="3" class="w-full bg-transparent text-sm focus:outline-none resize-none placeholder-slate-500" placeholder="Share your pulse with the world..."></textarea>
          
          <div id="imgPreviewHolder" class="hidden relative my-2">
            <img id="imgPreview" class="max-h-60 rounded-xl w-full object-cover border border-slate-700">
            <button id="clearImgBtn" class="absolute top-2 right-2 bg-black/80 text-white rounded-full w-6 h-6 text-xs">✕</button>
          </div>

          <div class="flex items-center justify-between pt-3 border-t border-slate-800/80 mt-2">
            <label class="cursor-pointer text-cyan-400 hover:text-cyan-300 text-xs flex items-center space-x-2 font-semibold">
              <i class="fa-regular fa-image text-base"></i>
              <span>Attach Media</span>
              <input type="file" id="postImage" accept="image/*" class="hidden">
            </label>
            <button id="submitPostBtn" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-bold px-5 py-2 rounded-xl text-xs hover:opacity-90 transition">Pulse</button>
          </div>
        </div>

        <!-- POSTS STREAM -->
        <div id="postsContainer" class="space-y-6"></div>
      </div>

      <!-- MESSAGES TAB -->
      <div id="tab-messages" class="hidden bg-slate-900/40 border border-slate-800/80 rounded-2xl h-[80vh] flex overflow-hidden">
        <div class="w-1/3 border-r border-slate-800/80 p-4">
          <h2 class="font-bold text-sm mb-4">Direct Messages</h2>
          <div class="text-xs text-slate-500">Global Chat Channel</div>
        </div>
        <div class="flex-1 flex flex-col justify-between p-4">
          <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
          <div class="flex space-x-2 pt-3 border-t border-slate-800">
            <input type="text" id="chatInput" class="flex-1 bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none" placeholder="Type a message...">
            <button id="sendMsgBtn" class="bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-xs"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </div>

      <!-- NOTIFICATIONS TAB -->
      <div id="tab-notifications" class="hidden bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 text-center text-slate-500 text-sm">
        No new notifications.
      </div>

    </main>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
