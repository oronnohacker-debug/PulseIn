<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035",
      measurementId: "G-N8L551KYDP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.currentUser = null;
    window.currentUserData = null;
    window.currentPlayingAudio = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        window.currentUser = user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          window.currentUserData = userDoc.data();
          updateUIWithUserData(window.currentUserData);
          listenToRealtimePosts();
          loadRealSuggestions();
          loadStories();
        } else {
          window.location.href = "setup-profile.html";
        }
      }
    });

    function updateUIWithUserData(data) {
      document.getElementById('sideProfileName').innerText = data.fullName || 'User';
      document.getElementById('sideUsername').innerText = '@' + (data.username || 'username');

      const avatarContainer = document.getElementById('sideAvatarContainer');
      const avatarHTML = data.photoURL 
        ? `<img src="${data.photoURL}" class="w-10 h-10 rounded-full object-cover border border-yellow-400">`
        : `<div class="w-10 h-10 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">${(data.fullName || 'U').substring(0, 2).toUpperCase()}</div>`;

      avatarContainer.innerHTML = avatarHTML;
    }

    // SUGGESTIONS
    async function loadRealSuggestions() {
      const container = document.getElementById('suggestionsContainer');
      container.innerHTML = "";

      try {
        const usersSnap = await getDocs(query(collection(db, "users"), limit(10)));
        let foundOthers = false;
        const myFollowing = window.currentUserData.following || [];

        usersSnap.forEach((docSnap) => {
          const user = docSnap.data();
          if (user.uid !== window.currentUser.uid) {
            foundOthers = true;
            const isFollowing = myFollowing.includes(user.uid);

            const userCard = document.createElement('div');
            userCard.className = "flex items-center justify-between p-2 rounded-xl hover:bg-neutral-900 transition";
            
            const avatar = user.photoURL 
              ? `<img src="${user.photoURL}" class="w-9 h-9 rounded-full object-cover border border-neutral-700">`
              : `<div class="w-9 h-9 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">${(user.fullName || 'U').substring(0, 2).toUpperCase()}</div>`;

            userCard.innerHTML = `
              <a href="profile.html?uid=${user.uid}" class="flex items-center space-x-3 cursor-pointer group">
                ${avatar}
                <div>
                  <p class="text-xs font-bold text-white group-hover:underline">${user.fullName || 'User'}</p>
                  <p class="text-[10px] text-neutral-400">@${user.username || 'user'}</p>
                </div>
              </a>
              <button onclick="window.toggleFollow('${user.uid}', this)" class="text-xs font-bold ${isFollowing ? 'text-neutral-400 bg-neutral-800' : 'text-black bg-yellow-400 hover:bg-yellow-300'} px-3 py-1.5 rounded-xl transition">
                ${isFollowing ? 'Following' : 'Follow'}
              </button>
            `;
            container.appendChild(userCard);
          }
        });

        if (!foundOthers) {
          container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-2">No other users yet.</p>`;
        }
      } catch (e) {
        container.innerHTML = `<p class="text-xs text-neutral-500 text-center py-2">Error loading suggestions.</p>`;
      }
    }

    // STORIES
    function loadStories() {
      const q = query(collection(db, "stories"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('storiesContainer');
        container.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const story = docSnap.data();
          const storyCircle = document.createElement('div');
          storyCircle.className = "flex-shrink-0 text-center cursor-pointer group";
          storyCircle.onclick = () => window.openStoryModal(story.media, story.authorName);
          
          storyCircle.innerHTML = `
            <div class="w-16 h-16 rounded-full border-2 border-yellow-400 p-0.5 overflow-hidden group-hover:scale-105 transition">
              <img src="${story.media}" class="w-full h-full rounded-full object-cover">
            </div>
            <span class="text-[10px] text-slate-300 font-medium mt-1 block truncate w-16">${story.authorName}</span>
          `;
          container.appendChild(storyCircle);
        });
      });
    }

    // REALTIME POSTS FEED
    function listenToRealtimePosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedPostsContainer');
        feed.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const isLiked = post.likes && post.likes.includes(window.currentUser.uid);
          const likeCount = post.likes ? post.likes.length : 0;
          const isMyPost = post.authorUid === window.currentUser.uid;

          let mediaHTML = "";
          if (post.media) {
            if (post.type === 'reel' || (post.mediaType && post.mediaType.startsWith('video/'))) {
              mediaHTML = `<video src="${post.media}" controls class="w-full rounded-xl max-h-96 object-cover border border-neutral-800"></video>`;
            } else {
              mediaHTML = `<img src="${post.media}" class="w-full rounded-xl max-h-96 object-cover border border-neutral-800">`;
            }
          }

          let audioHTML = "";
          if (post.songUrl) {
            audioHTML = `
              <div class="flex items-center space-x-2 bg-neutral-900 p-2 rounded-xl border border-neutral-800 text-xs text-yellow-400">
                <i class="fa-solid fa-music animate-spin"></i>
                <span class="font-semibold">${post.songTitle || 'Selected Song'}</span>
                <audio src="${post.songUrl}" controls class="h-6 w-full max-w-[200px] ml-auto"></audio>
              </div>
            `;
          }

          const authorAvatar = post.authorPhoto 
            ? `<img src="${post.authorPhoto}" class="w-9 h-9 rounded-full object-cover border border-neutral-700">`
            : `<div class="w-9 h-9 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs border border-neutral-700">${(post.authorName || 'U').substring(0, 2).toUpperCase()}</div>`;

          const postCard = document.createElement('div');
          postCard.className = "bg-[#121212] border border-neutral-800 rounded-2xl p-4 space-y-3 relative";
          postCard.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <a href="profile.html?uid=${post.authorUid}" class="cursor-pointer">
                  ${authorAvatar}
                </a>
                <div>
                  <a href="profile.html?uid=${post.authorUid}" class="text-xs font-bold text-white hover:underline">${post.authorName}</a>
                  <p class="text-[10px] text-neutral-400">@${post.username} ${post.type === 'reel' ? '• <span class="text-yellow-400 font-bold">Reel</span>' : ''}</p>
                </div>
              </div>

              <!-- EDIT & DELETE BUTTONS (FOR ALL POSTS) -->
              <div class="flex items-center space-x-2">
                ${isMyPost ? `<button onclick="window.editPost('${postId}', '${encodeURIComponent(post.text || '')}')" class="text-neutral-400 hover:text-yellow-400 text-xs"><i class="fa-solid fa-pen-to-square"></i> Edit</button>` : ''}
                <button onclick="window.deletePost('${postId}')" class="text-neutral-400 hover:text-red-500 text-xs"><i class="fa-solid fa-trash"></i> Delete</button>
              </div>
            </div>

            ${post.text ? `<p id="postText-${postId}" class="text-xs text-slate-200 leading-relaxed">${post.text}</p>` : ''}
            ${audioHTML}
            ${mediaHTML}
            
            <div class="flex items-center justify-between pt-2 border-t border-neutral-800 text-neutral-400 text-sm">
              <button onclick="window.toggleLikeFirebase('${postId}', ${isLiked})" class="hover:text-red-500 flex items-center space-x-1.5 transition ${isLiked ? 'text-red-500 font-bold' : ''}">
                <i class="${isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                <span class="text-xs">${likeCount}</span>
              </button>
              <button onclick="window.toggleCommentBox('${postId}')" class="hover:text-yellow-400 flex items-center space-x-1.5 transition">
                <i class="fa-regular fa-comment"></i>
                <span class="text-xs" id="commentCount-${postId}">0</span>
              </button>
              <button onclick="window.copyPostLink()" class="hover:text-yellow-400 transition flex items-center space-x-1 text-xs">
                <i class="fa-regular fa-paper-plane"></i>
                <span>Share</span>
              </button>
            </div>

            <!-- COMMENTS CONTAINER -->
            <div id="commentSection-${postId}" class="hidden pt-3 border-t border-neutral-800/80 space-y-3">
              <div id="commentsList-${postId}" class="space-y-2 max-h-48 overflow-y-auto"></div>
              
              <div class="flex items-center space-x-2">
                <input type="text" id="commentInput-${postId}" placeholder="Write a comment..." class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-yellow-400">
                <button onclick="window.sendTextComment('${postId}')" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-3 py-1.5 rounded-xl text-xs">Send</button>
              </div>
            </div>
          `;
          feed.appendChild(postCard);
          window.listenToComments(postId);
        });
      });
    }

    // EDIT & DELETE FUNCTIONS
    window.deletePost = async (postId) => {
      if (confirm("Are you sure you want to delete this post/reel?")) {
        await deleteDoc(doc(db, "posts", postId));
      }
    };

    window.editPost = async (postId, currentTextEncoded) => {
      const currentText = decodeURIComponent(currentTextEncoded);
      const newText = prompt("Edit your post text:", currentText);
      if (newText !== null && newText.trim() !== "") {
        await updateDoc(doc(db, "posts", postId), { text: newText.trim() });
      }
    };

    // MUSIC PLAYER FOR REELS UPLOAD
    window.playPreviewSong = (songUrl) => {
      if (window.currentPlayingAudio) {
        window.currentPlayingAudio.pause();
      }
      window.currentPlayingAudio = new Audio(songUrl);
      window.currentPlayingAudio.play();
    };

    // CREATE POST OR REEL PUBLISH
    window.publishPostOrReel = async () => {
      const activeTab = window.currentCreateTab || 'post';
      const text = document.getElementById('postInputText').value.trim();
      
      if (!text && !window.selectedMediaBase64) {
        alert("Please write something or attach media/reel video!");
        return;
      }

      const songSelect = document.getElementById('reelSongSelect');
      const selectedSongUrl = songSelect ? songSelect.value : "";
      const selectedSongTitle = songSelect && songSelect.options[songSelect.selectedIndex] ? songSelect.options[songSelect.selectedIndex].text : "";

      try {
        await addDoc(collection(db, "posts"), {
          type: activeTab, // 'post' or 'reel'
          text: text,
          media: window.selectedMediaBase64 || null,
          mediaType: window.selectedMediaType || null,
          songUrl: activeTab === 'reel' ? selectedSongUrl : null,
          songTitle: activeTab === 'reel' ? selectedSongTitle : null,
          authorUid: window.currentUser.uid,
          authorName: window.currentUserData.fullName || "User",
          authorPhoto: window.currentUserData.photoURL || null,
          username: window.currentUserData.username || "user",
          likes: [],
          createdAt: serverTimestamp()
        });

        if (window.currentPlayingAudio) window.currentPlayingAudio.pause();
        document.getElementById('postInputText').value = "";
        window.closeCreatePostModal();
      } catch (err) {
        alert("Error: " + err.message);
      }
    };

    // COMMENTS LOGIC
    window.toggleCommentBox = (postId) => {
      document.getElementById(`commentSection-${postId}`).classList.toggle('hidden');
    };

    window.listenToComments = (postId) => {
      const commentsRef = collection(db, "posts", postId, "comments");
      const q = query(commentsRef, orderBy("createdAt", "asc"));

      onSnapshot(q, (snapshot) => {
        const list = document.getElementById(`commentsList-${postId}`);
        const countSpan = document.getElementById(`commentCount-${postId}`);
        if (!list) return;

        list.innerHTML = "";
        countSpan.innerText = snapshot.size;

        snapshot.forEach((docSnap) => {
          const c = docSnap.data();
          const item = document.createElement('div');
          item.className = "bg-neutral-900 p-2 rounded-xl text-xs space-y-1 border border-neutral-800/60";
          item.innerHTML = `
            <span class="font-bold text-yellow-400">${c.authorName}</span>
            ${c.text ? `<p class="text-slate-200">${c.text}</p>` : ''}
          `;
          list.appendChild(item);
        });
      });
    };

    window.sendTextComment = async (postId) => {
      const input = document.getElementById(`commentInput-${postId}`);
      const val = input.value.trim();
      if (!val) return;

      await addDoc(collection(db, "posts", postId, "comments"), {
        text: val,
        authorUid: window.currentUser.uid,
        authorName: window.currentUserData.fullName || "User",
        createdAt: serverTimestamp()
      });
      input.value = "";
    };

    window.toggleLikeFirebase = async (postId, currentlyLiked) => {
      const postRef = doc(db, "posts", postId);
      if (currentlyLiked) {
        await updateDoc(postRef, { likes: arrayRemove(window.currentUser.uid) });
      } else {
        await updateDoc(postRef, { likes: arrayUnion(window.currentUser.uid) });
      }
    };

    window.openCreatePostModal = () => {
      document.getElementById('createPostModal').classList.remove('hidden');
    };

    window.closeCreatePostModal = () => {
      if (window.currentPlayingAudio) window.currentPlayingAudio.pause();
      document.getElementById('createPostModal').classList.add('hidden');
      window.removeMedia();
    };

    window.userLogout = () => {
      signOut(auth).then(() => window.location.href = "login.html");
    };

    window.copyPostLink = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    };
  </script>
</head>
<body class="bg-black text-slate-100 min-h-screen flex font-sans select-none relative overflow-x-hidden">

  <!-- AUTO-EXPANDING SIDEBAR -->
  <aside class="w-16 hover:w-60 transition-all duration-300 ease-in-out fixed top-0 left-0 h-screen bg-black border-r border-neutral-800 flex flex-col justify-between p-3 z-40 group overflow-hidden">
    <div class="space-y-6">
      <a href="index.html" class="flex items-center space-x-4 px-1 py-1">
        <img src="logo.png" alt="PulseIn Logo" class="w-8 h-8 object-contain flex-shrink-0" onerror="this.src='https://via.placeholder.com/40/yellow/black?text=P'">
        <span class="text-lg font-bold tracking-wider text-yellow-400 opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">PulseIn</span>
      </a>

      <nav class="space-y-1">
        <a href="index.html" class="flex items-center space-x-4 p-2.5 rounded-2xl bg-neutral-900 text-yellow-400 font-bold">
          <i class="fa-solid fa-house text-lg w-6 text-center flex-shrink-0"></i>
          <span class="text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Home</span>
        </a>
        <a href="reels.html" class="flex items-center space-x-4 p-2.5 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-solid fa-clapperboard text-lg w-6 text-center flex-shrink-0"></i>
          <span class="text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Reels</span>
        </a>
        
        <!-- CREATE BUTTON WITH REELS & POST -->
        <button onclick="window.openCreatePostModal()" class="w-full flex items-center space-x-4 p-2.5 rounded-2xl hover:bg-neutral-900 text-yellow-400 transition">
          <i class="fa-regular fa-square-plus text-lg w-6 text-center flex-shrink-0"></i>
          <span class="text-xs font-bold opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Create</span>
        </button>

        <a href="messages.html" class="flex items-center space-x-4 p-2.5 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-regular fa-paper-plane text-lg w-6 text-center flex-shrink-0"></i>
          <span class="text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Messages</span>
        </a>
        <a href="profile.html" class="flex items-center space-x-4 p-2.5 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-regular fa-user text-lg w-6 text-center flex-shrink-0"></i>
          <span class="text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Profile</span>
        </a>
      </nav>
    </div>

    <div class="border-t border-neutral-800 pt-3">
      <button onclick="userLogout()" class="w-full flex items-center space-x-4 p-2.5 rounded-2xl hover:bg-neutral-900 text-red-500 font-semibold transition">
        <i class="fa-solid fa-right-from-bracket text-lg w-6 text-center flex-shrink-0"></i>
        <span class="text-xs opacity-0 group-hover:opacity-100 transition-opacity duration-200 whitespace-nowrap">Log Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT CONTAINER -->
  <div class="pl-20 flex-1 flex justify-center max-w-7xl mx-auto px-6 py-6 gap-8">
    <main class="w-full max-w-lg space-y-6">
      
      <!-- STORIES -->
      <div class="flex space-x-4 overflow-x-auto pb-2 border-b border-neutral-800 scrollbar-none">
        <div id="storiesContainer" class="flex space-x-4"></div>
      </div>

      <!-- FEED -->
      <div id="feedPostsContainer" class="space-y-6"></div>
    </main>

    <!-- RIGHT PANEL -->
    <aside class="hidden lg:block w-80 space-y-6 pt-2">
      <div class="flex items-center justify-between">
        <a href="profile.html" class="flex items-center space-x-3 group cursor-pointer">
          <div id="sideAvatarContainer"></div>
          <div>
            <p id="sideProfileName" class="text-xs font-bold text-white group-hover:underline">Loading...</p>
            <p id="sideUsername" class="text-[11px] text-neutral-400">@user</p>
          </div>
        </a>
      </div>

      <div class="border-t border-neutral-800 pt-4 space-y-3">
        <span class="text-xs font-bold text-white block">Suggested for you</span>
        <div id="suggestionsContainer" class="space-y-2"></div>
      </div>
    </aside>
  </div>

  <!-- CREATE POST / REEL MODAL -->
  <div id="createPostModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-[#121212] border border-neutral-800 rounded-2xl w-full max-w-md p-5 space-y-4">
      
      <!-- TAB SELECTOR (POST / REEL) -->
      <div class="flex border-b border-neutral-800 pb-2">
        <button id="tabPostBtn" onclick="switchCreateTab('post')" class="flex-1 text-center py-1.5 font-bold text-xs border-b-2 border-yellow-400 text-yellow-400">Post</button>
        <button id="tabReelBtn" onclick="switchCreateTab('reel')" class="flex-1 text-center py-1.5 font-bold text-xs text-neutral-400 border-b-2 border-transparent hover:text-white">Reel Video</button>
        <button onclick="window.closeCreatePostModal()" class="text-neutral-400 hover:text-white ml-2"><i class="fa-solid fa-xmark text-base"></i></button>
      </div>
      
      <textarea id="postInputText" rows="3" placeholder="Write a caption..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-3 text-xs focus:outline-none focus:border-yellow-400 text-white resize-none"></textarea>

      <!-- REEL MUSIC SELECTION BOX (Visible in Reel Tab) -->
      <div id="reelMusicBox" class="hidden space-y-2 bg-neutral-900 p-3 rounded-xl border border-neutral-800">
        <label class="text-[11px] font-bold text-yellow-400 block"><i class="fa-solid fa-music"></i> Select World Popular Song:</label>
        <div class="flex items-center space-x-2">
          <select id="reelSongSelect" class="flex-1 bg-black border border-neutral-700 text-xs rounded-lg p-2 text-slate-200 focus:outline-none">
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Trending Song 1 - Synth Pop</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Trending Song 2 - Acoustic Chill</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Trending Song 3 - Energetic Beat</option>
            <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3">Trending Song 4 - World Electronic</option>
          </select>
          <button onclick="window.playPreviewSong(document.getElementById('reelSongSelect').value)" class="bg-yellow-400 text-black px-3 py-2 rounded-lg text-xs font-bold hover:bg-yellow-300">
            <i class="fa-solid fa-play"></i>
          </button>
        </div>
      </div>

      <!-- MEDIA PREVIEW -->
      <div id="mediaPreviewContainer" class="hidden relative rounded-xl overflow-hidden max-h-52 border border-neutral-800">
        <div id="mediaPreviewHolder"></div>
        <button onclick="removeMedia()" class="absolute top-2 right-2 bg-black/80 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="flex items-center justify-between pt-2 border-t border-neutral-800/80">
        <label class="cursor-pointer hover:text-yellow-400 flex items-center space-x-1.5 text-xs text-slate-400">
          <i class="fa-regular fa-image text-base text-yellow-400"></i>
          <span id="mediaInputLabel">Photo / Video</span>
          <input type="file" id="postMediaInput" accept="image/*,video/*" onchange="previewMedia(event)" class="hidden">
        </label>
        <button onclick="publishPostOrReel()" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-5 py-1.5 rounded-xl text-xs transition">Publish</button>
      </div>
    </div>
  </div>

  <script>
    window.selectedMediaBase64 = null;
    window.selectedMediaType = null;
    window.currentCreateTab = 'post';

    function switchCreateTab(tab) {
      window.currentCreateTab = tab;
      const postBtn = document.getElementById('tabPostBtn');
      const reelBtn = document.getElementById('tabReelBtn');
      const musicBox = document.getElementById('reelMusicBox');
      const mediaLabel = document.getElementById('mediaInputLabel');

      if (tab === 'reel') {
        reelBtn.className = "flex-1 text-center py-1.5 font-bold text-xs border-b-2 border-yellow-400 text-yellow-400";
        postBtn.className = "flex-1 text-center py-1.5 font-bold text-xs text-neutral-400 border-b-2 border-transparent hover:text-white";
        musicBox.classList.remove('hidden');
        mediaLabel.innerText = "Reel Video Only";
        document.getElementById('postMediaInput').accept = "video/*";
      } else {
        postBtn.className = "flex-1 text-center py-1.5 font-bold text-xs border-b-2 border-yellow-400 text-yellow-400";
        reelBtn.className = "flex-1 text-center py-1.5 font-bold text-xs text-neutral-400 border-b-2 border-transparent hover:text-white";
        musicBox.classList.add('hidden');
        mediaLabel.innerText = "Photo / Video";
        document.getElementById('postMediaInput').accept = "image/*,video/*";
      }
    }

    function previewMedia(event) {
      const file = event.target.files[0];
      if (file) {
        window.selectedMediaType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
          window.selectedMediaBase64 = e.target.result;
          const holder = document.getElementById('mediaPreviewHolder');
          if (window.selectedMediaType.startsWith('video/')) {
            holder.innerHTML = `<video src="${window.selectedMediaBase64}" controls class="w-full max-h-52 object-cover"></video>`;
          } else {
            holder.innerHTML = `<img src="${window.selectedMediaBase64}" class="w-full max-h-52 object-cover">`;
          }
          document.getElementById('mediaPreviewContainer').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function removeMedia() {
      window.selectedMediaBase64 = null;
      window.selectedMediaType = null;
      document.getElementById('postMediaInput').value = "";
      document.getElementById('mediaPreviewContainer').classList.add('hidden');
    }
  </script>
</body>
</html>
