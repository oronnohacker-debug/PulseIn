<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035",
      measurementId: "G-N8L551KYDP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.currentUser = null;
    window.currentUserData = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        window.currentUser = user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          window.currentUserData = userDoc.data();
          updateUIWithUserData(window.currentUserData);
          listenToRealtimePosts();
          loadRealSuggestions();
          loadStories();
        } else {
          window.location.href = "setup-profile.html";
        }
      }
    });

    function updateUIWithUserData(data) {
      document.getElementById('sideProfileName').innerText = data.fullName || 'User';
      document.getElementById('sideUsername').innerText = '@' + (data.username || 'username');

      const avatarContainer = document.getElementById('sideAvatarContainer');
      const postAvatarContainer = document.getElementById('postAvatarContainer');

      const avatarHTML = data.photoURL 
        ? `<img src="${data.photoURL}" class="w-11 h-11 rounded-full object-cover border border-yellow-400">`
        : `<div class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-sm">${(data.fullName || 'U').substring(0, 2).toUpperCase()}</div>`;

      avatarContainer.innerHTML = avatarHTML;
      postAvatarContainer.innerHTML = data.photoURL 
        ? `<img src="${data.photoURL}" class="w-10 h-10 rounded-full object-cover border border-yellow-400">`
        : `<div class="w-10 h-10 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">${(data.fullName || 'U').substring(0, 2).toUpperCase()}</div>`;
    }

    // REAL SUGGESTIONS WITH FOLLOW BUTTON & PROFILE LINKS
    async function loadRealSuggestions() {
      const container = document.getElementById('suggestionsContainer');
      container.innerHTML = "";

      try {
        const usersSnap = await getDocs(query(collection(db, "users"), limit(10)));
        let foundOthers = false;

        const myFollowing = window.currentUserData.following || [];

        usersSnap.forEach((docSnap) => {
          const user = docSnap.data();
          if (user.uid !== window.currentUser.uid) {
            foundOthers = true;
            const isFollowing = myFollowing.includes(user.uid);

            const userCard = document.createElement('div');
            userCard.className = "flex items-center justify-between p-2 rounded-xl hover:bg-neutral-900 transition";
            
            const avatar = user.photoURL 
              ? `<img src="${user.photoURL}" class="w-9 h-9 rounded-full object-cover border border-neutral-700">`
              : `<div class="w-9 h-9 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">${(user.fullName || 'U').substring(0, 2).toUpperCase()}</div>`;

            userCard.innerHTML = `
              <a href="profile.html?uid=${user.uid}" class="flex items-center space-x-3 cursor-pointer group">
                ${avatar}
                <div>
                  <p class="text-xs font-bold text-white group-hover:underline">${user.fullName || 'User'}</p>
                  <p class="text-[10px] text-neutral-400">@${user.username || 'user'}</p>
                </div>
              </a>
              <button onclick="window.toggleFollow('${user.uid}', this)" class="text-xs font-bold ${isFollowing ? 'text-neutral-400 bg-neutral-800' : 'text-black bg-yellow-400 hover:bg-yellow-300'} px-3 py-1.5 rounded-xl transition">
                ${isFollowing ? 'Following' : 'Follow'}
              </button>
            `;
            container.appendChild(userCard);
          }
        });

        if (!foundOthers) {
          container.innerHTML = `<p class="text-xs text-neutral-400 text-center py-2">No other users yet.</p>`;
        }
      } catch (e) {
        container.innerHTML = `<p class="text-xs text-neutral-500 text-center py-2">Error loading suggestions.</p>`;
      }
    }

    // FOLLOW / UNFOLLOW SYSTEM
    window.toggleFollow = async (targetUid, btn) => {
      const myRef = doc(db, "users", window.currentUser.uid);
      const targetRef = doc(db, "users", targetUid);

      const isFollowing = window.currentUserData.following && window.currentUserData.following.includes(targetUid);

      if (isFollowing) {
        await updateDoc(myRef, { following: arrayRemove(targetUid) });
        await updateDoc(targetRef, { followers: arrayRemove(window.currentUser.uid) });
        window.currentUserData.following = window.currentUserData.following.filter(id => id !== targetUid);
        btn.innerText = "Follow";
        btn.className = "text-xs font-bold text-black bg-yellow-400 hover:bg-yellow-300 px-3 py-1.5 rounded-xl transition";
      } else {
        await updateDoc(myRef, { following: arrayUnion(targetUid) });
        await updateDoc(targetRef, { followers: arrayUnion(window.currentUser.uid) });
        if (!window.currentUserData.following) window.currentUserData.following = [];
        window.currentUserData.following.push(targetUid);
        btn.innerText = "Following";
        btn.className = "text-xs font-bold text-neutral-400 bg-neutral-800 px-3 py-1.5 rounded-xl transition";
      }
    };

    // REAL TIME STORIES LOADER
    function loadStories() {
      const q = query(collection(db, "stories"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('storiesContainer');
        container.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const story = docSnap.data();
          const storyCircle = document.createElement('a');
          storyCircle.href = `profile.html?uid=${story.authorUid}`;
          storyCircle.className = "flex-shrink-0 text-center cursor-pointer group";
          
          storyCircle.innerHTML = `
            <div class="w-16 h-16 rounded-full border-2 border-yellow-400 p-0.5 overflow-hidden group-hover:scale-105 transition">
              <img src="${story.media}" class="w-full h-full rounded-full object-cover">
            </div>
            <span class="text-[10px] text-slate-300 font-medium mt-1 block truncate w-16">${story.authorName}</span>
          `;
          container.appendChild(storyCircle);
        });
      });
    }

    // PUBLISH STORY TO FIRESTORE
    window.uploadStoryFile = async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          await addDoc(collection(db, "stories"), {
            media: e.target.result,
            authorUid: window.currentUser.uid,
            authorName: window.currentUserData.fullName || "User",
            createdAt: serverTimestamp()
          });
          alert("Story Uploaded Successfully!");
        } catch (err) {
          alert("Error uploading story: " + err.message);
        }
      };
      reader.readAsDataURL(file);
    };

    // FEED POSTS LOADER
    function listenToRealtimePosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedPostsContainer');
        feed.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const isLiked = post.likes && post.likes.includes(window.currentUser.uid);
          const likeCount = post.likes ? post.likes.length : 0;

          let mediaHTML = "";
          if (post.media) {
            if (post.mediaType && post.mediaType.startsWith('video/')) {
              mediaHTML = `<video src="${post.media}" controls class="w-full rounded-xl max-h-96 object-cover border border-neutral-800"></video>`;
            } else {
              mediaHTML = `<img src="${post.media}" class="w-full rounded-xl max-h-96 object-cover border border-neutral-800">`;
            }
          }

          const authorAvatar = post.authorPhoto 
            ? `<img src="${post.authorPhoto}" class="w-9 h-9 rounded-full object-cover border border-neutral-700">`
            : `<div class="w-9 h-9 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs border border-neutral-700">${(post.authorName || 'U').substring(0, 2).toUpperCase()}</div>`;

          const postCard = document.createElement('div');
          postCard.className = "bg-[#121212] border border-neutral-800 rounded-2xl p-4 space-y-3";
          postCard.innerHTML = `
            <div class="flex items-center space-x-3">
              <a href="profile.html?uid=${post.authorUid}" class="cursor-pointer">
                ${authorAvatar}
              </a>
              <div>
                <a href="profile.html?uid=${post.authorUid}" class="text-xs font-bold text-white hover:underline">${post.authorName}</a>
                <p class="text-[10px] text-neutral-400">@${post.username}</p>
              </div>
            </div>
            ${post.text ? `<p class="text-xs text-slate-200 leading-relaxed">${post.text}</p>` : ''}
            ${mediaHTML}
            <div class="flex items-center justify-between pt-2 border-t border-neutral-800 text-neutral-400 text-sm">
              <button onclick="window.toggleLikeFirebase('${postId}', ${isLiked})" class="hover:text-red-500 flex items-center space-x-1.5 transition ${isLiked ? 'text-red-500 font-bold' : ''}">
                <i class="${isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                <span class="text-xs">${likeCount}</span>
              </button>
              <button class="hover:text-yellow-400 flex items-center space-x-1.5 transition">
                <i class="fa-regular fa-comment"></i>
                <span class="text-xs">0</span>
              </button>
              <button onclick="window.copyPostLink()" class="hover:text-yellow-400 transition flex items-center space-x-1 text-xs">
                <i class="fa-regular fa-paper-plane"></i>
                <span>Share</span>
              </button>
            </div>
          `;
          feed.appendChild(postCard);
        });
      });
    }

    // CREATE POST
    window.publishPost = async () => {
      const text = document.getElementById('postInputText').value.trim();
      if (!text && !window.selectedMediaBase64) {
        alert("Please write something or attach media!");
        return;
      }

      try {
        await addDoc(collection(db, "posts"), {
          text: text,
          media: window.selectedMediaBase64 || null,
          mediaType: window.selectedMediaType || null,
          authorUid: window.currentUser.uid,
          authorName: window.currentUserData.fullName || "User",
          authorPhoto: window.currentUserData.photoURL || null,
          username: window.currentUserData.username || "user",
          likes: [],
          createdAt: serverTimestamp()
        });

        document.getElementById('postInputText').value = "";
        window.removeMedia();
      } catch (err) {
        alert("Error publishing post: " + err.message);
      }
    };

    window.toggleLikeFirebase = async (postId, currentlyLiked) => {
      const postRef = doc(db, "posts", postId);
      if (currentlyLiked) {
        await updateDoc(postRef, { likes: arrayRemove(window.currentUser.uid) });
      } else {
        await updateDoc(postRef, { likes: arrayUnion(window.currentUser.uid) });
      }
    };

    window.userLogout = () => {
      signOut(auth).then(() => window.location.href = "login.html");
    };

    window.copyPostLink = () => {
      navigator.clipboard.writeText(window.location.href);
      alert("Link copied!");
    };
  </script>
</head>
<body class="bg-black text-slate-100 min-h-screen flex font-sans select-none relative">

  <!-- LEFT NAVIGATION SIDEBAR -->
  <aside class="w-64 fixed top-0 left-0 h-screen bg-black border-r border-neutral-800 flex flex-col justify-between p-4 z-40">
    <div class="space-y-6">
      <a href="index.html" class="flex items-center space-x-3 px-2 py-1">
        <img src="logo.png" alt="PulseIn Logo" class="w-9 h-9 object-contain" onerror="this.src='https://via.placeholder.com/40/yellow/black?text=P'">
        <span class="text-xl font-bold tracking-wider text-yellow-400">PulseIn</span>
      </a>

      <nav class="space-y-1">
        <a href="index.html" class="flex items-center space-x-4 p-3 rounded-2xl bg-neutral-900 text-yellow-400 font-bold">
          <i class="fa-solid fa-house text-lg w-6 text-center"></i>
          <span class="text-sm">Home</span>
        </a>
        <a href="search.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-solid fa-magnifying-glass text-lg w-6 text-center"></i>
          <span class="text-sm">Search</span>
        </a>
        <a href="reels.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-solid fa-clapperboard text-lg w-6 text-center"></i>
          <span class="text-sm">Reels</span>
        </a>
        <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-regular fa-paper-plane text-lg w-6 text-center"></i>
          <span class="text-sm">Messages</span>
        </a>
        <a href="notifications.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-regular fa-heart text-lg w-6 text-center"></i>
          <span class="text-sm">Notifications</span>
        </a>
        <a href="dashboard.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-solid fa-chart-line text-lg w-6 text-center"></i>
          <span class="text-sm">Dashboard</span>
        </a>
        <a href="settings.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-solid fa-gear text-lg w-6 text-center"></i>
          <span class="text-sm">Settings</span>
        </a>
        <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-slate-300 hover:text-yellow-400 transition">
          <i class="fa-regular fa-user text-lg w-6 text-center"></i>
          <span class="text-sm">Profile</span>
        </a>
      </nav>
    </div>

    <div class="border-t border-neutral-800 pt-3">
      <button onclick="userLogout()" class="w-full flex items-center space-x-4 p-3 rounded-2xl hover:bg-neutral-900 text-red-500 font-semibold transition">
        <i class="fa-solid fa-right-from-bracket text-lg w-6 text-center"></i>
        <span class="text-sm">Log Out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <div class="pl-64 flex-1 flex justify-center max-w-7xl mx-auto px-6 py-6 gap-8">

    <main class="w-full max-w-lg space-y-6">

      <!-- REAL-TIME STORIES ROW -->
      <div class="flex space-x-4 overflow-x-auto pb-2 border-b border-neutral-800 scrollbar-none">
        <label class="flex-shrink-0 text-center cursor-pointer group">
          <div class="w-16 h-16 rounded-full border-2 border-dashed border-yellow-400 p-0.5 flex items-center justify-center bg-neutral-900 group-hover:scale-105 transition">
            <i class="fa-solid fa-plus text-yellow-400 text-lg"></i>
          </div>
          <span class="text-[10px] text-slate-300 font-medium mt-1 block">Your Story</span>
          <input type="file" accept="image/*,video/*" onchange="window.uploadStoryFile(event)" class="hidden">
        </label>
        
        <div id="storiesContainer" class="flex space-x-4"></div>
      </div>

      <!-- CREATE POST BOX (WITH 'POST' TEXT ON BUTTON) -->
      <div class="bg-[#121212] border border-neutral-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center space-x-3">
          <a href="profile.html" id="postAvatarContainer" class="flex-shrink-0 cursor-pointer">
            <div class="w-10 h-10 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs">--</div>
          </a>
          <input type="text" id="postInputText" placeholder="What's on your mind?" class="w-full bg-neutral-900 border border-neutral-800 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-yellow-400 text-white">
        </div>

        <div id="mediaPreviewContainer" class="hidden relative rounded-xl overflow-hidden max-h-60 border border-neutral-800">
          <div id="mediaPreviewHolder"></div>
          <button onclick="removeMedia()" class="absolute top-2 right-2 bg-black/80 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-neutral-800/80">
          <label class="cursor-pointer hover:text-yellow-400 flex items-center space-x-1.5 text-xs text-slate-400">
            <i class="fa-regular fa-image text-base text-yellow-400"></i>
            <span>Photo / Video</span>
            <input type="file" id="postMediaInput" accept="image/*,video/*" onchange="previewMedia(event)" class="hidden">
          </label>
          <!-- 'POST' BUTTON TEXT CLEARLY VISIBLE -->
          <button onclick="publishPost()" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-5 py-1.5 rounded-xl text-xs transition">
            Post
          </button>
        </div>
      </div>

      <!-- DYNAMIC FEED POSTS -->
      <div id="feedPostsContainer" class="space-y-6"></div>
    </main>

    <!-- RIGHT PANEL (SUGGESTIONS WITH FOLLOW BUTTON) -->
    <aside class="hidden lg:block w-80 space-y-6 pt-2">
      <div class="flex items-center justify-between">
        <a href="profile.html" class="flex items-center space-x-3 group cursor-pointer">
          <div id="sideAvatarContainer">
            <div class="w-11 h-11 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-sm">--</div>
          </div>
          <div>
            <p id="sideProfileName" class="text-xs font-bold text-white group-hover:underline">Loading...</p>
            <p id="sideUsername" class="text-[11px] text-neutral-400">@user</p>
          </div>
        </a>
        <button onclick="userLogout()" class="text-xs font-bold text-yellow-400 hover:underline">Switch</button>
      </div>

      <div class="border-t border-neutral-800 pt-4 space-y-3">
        <span class="text-xs font-bold text-white block">Suggested for you</span>
        <div id="suggestionsContainer" class="space-y-2"></div>
      </div>
    </aside>

  </div>

  <script>
    window.selectedMediaBase64 = null;
    window.selectedMediaType = null;

    function previewMedia(event) {
      const file = event.target.files[0];
      if (file) {
        window.selectedMediaType = file.type;
        const reader = new FileReader();
        reader.onload = function(e) {
          window.selectedMediaBase64 = e.target.result;
          const holder = document.getElementById('mediaPreviewHolder');
          if (window.selectedMediaType.startsWith('video/')) {
            holder.innerHTML = `<video src="${window.selectedMediaBase64}" controls class="w-full max-h-60 object-cover"></video>`;
          } else {
            holder.innerHTML = `<img src="${window.selectedMediaBase64}" class="w-full max-h-60 object-cover">`;
          }
          document.getElementById('mediaPreviewContainer').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function removeMedia() {
      window.selectedMediaBase64 = null;
      window.selectedMediaType = null;
      document.getElementById('postMediaInput').value = "";
      document.getElementById('mediaPreviewContainer').classList.add('hidden');
    }
  </script>
</body>
</html>
