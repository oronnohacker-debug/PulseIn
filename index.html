<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Custom Scrollbar Hide */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen font-sans flex justify-center">

  <!-- MAIN APP WRAPPER -->
  <div class="w-full max-w-[1280px] flex min-h-screen">

    <!-- LEFT NAVIGATION SIDEBAR -->
    <aside class="w-20 xl:w-64 border-r border-neutral-900 p-4 flex flex-col justify-between fixed h-full bg-black z-30">
      <div class="space-y-6">
        <h1 class="text-xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-purple-500 hidden xl:block px-2">PulseIn</h1>
        <div class="text-2xl font-bold text-yellow-400 xl:hidden text-center">P</div>

        <nav class="space-y-2">
          <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl bg-neutral-900 text-white font-bold">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="hidden xl:inline text-sm">Home</span>
          </a>
          <a href="search.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-neutral-400 hover:text-white transition">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="hidden xl:inline text-sm">Search</span>
          </a>
          <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-neutral-400 hover:text-white transition">
            <i class="fa-regular fa-paper-plane text-lg"></i>
            <span class="hidden xl:inline text-sm">Messages</span>
          </a>
          <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-neutral-400 hover:text-white transition">
            <img id="navMyAvatar" src="profile.png" class="w-6 h-6 rounded-full object-cover" onerror="this.src='profile.png'">
            <span class="hidden xl:inline text-sm">Profile</span>
          </a>
        </nav>
      </div>

      <button id="logoutBtn" class="flex items-center space-x-4 p-3 rounded-xl text-red-500 hover:bg-neutral-900 transition w-full">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
        <span class="hidden xl:inline text-sm font-bold">Logout</span>
      </button>
    </aside>

    <!-- MIDDLE FEED SECTION -->
    <main class="flex-1 ml-20 xl:ml-64 mr-0 lg:mr-80 min-h-screen border-r border-neutral-900 px-4 py-4 max-w-[640px] mx-auto">
      
      <!-- STORIES SECTION WITH SLIDER -->
      <div class="relative w-full border-b border-neutral-900 pb-4 my-2">
        <!-- Left Scroll Button -->
        <button id="btnScrollLeft" class="absolute left-1 top-1/2 -translate-y-1/2 z-10 bg-black/80 hover:bg-black text-white w-8 h-8 rounded-full border border-neutral-700 shadow-lg flex items-center justify-center">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>

        <!-- Stories Wrapper (Horizontal Scrollable) -->
        <div id="storiesWrapper" class="flex space-x-4 overflow-x-auto scrollbar-none scroll-smooth px-10 items-center">
          
          <!-- MY STORY (UPLOAD) -->
          <div class="flex flex-col items-center space-y-1 flex-shrink-0 relative">
            <div id="myStoryBtn" class="relative w-16 h-16 rounded-full p-[2px] bg-neutral-800 border-2 border-dashed border-yellow-400 flex items-center justify-center cursor-pointer hover:scale-105 transition">
              <img id="myStoryAvatar" src="profile.png" class="w-full h-full rounded-full object-cover" onerror="this.src='profile.png'">
              <div class="absolute bottom-0 right-0 bg-blue-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold border-2 border-black">+</div>
            </div>
            <span class="text-[11px] text-neutral-400">Your story</span>
            <input type="file" id="storyInput" accept="image/*,video/*" class="hidden">
          </div>

          <!-- DYNAMIC STORIES FROM FOLLOWED USERS -->
          <div id="storiesContainer" class="flex space-x-4 flex-shrink-0"></div>

        </div>

        <!-- Right Scroll Button -->
        <button id="btnScrollRight" class="absolute right-1 top-1/2 -translate-y-1/2 z-10 bg-black/80 hover:bg-black text-white w-8 h-8 rounded-full border border-neutral-700 shadow-lg flex items-center justify-center">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <!-- MAIN FEED POSTS CONTAINER -->
      <div id="feedPostsContainer" class="pt-4 space-y-6">
        <p class="text-xs text-neutral-500 text-center py-10">Loading feed...</p>
      </div>

    </main>

    <!-- RIGHT SIDEBAR (Suggested Users) -->
    <aside class="hidden lg:block w-80 fixed right-0 h-full p-6 space-y-6 bg-black z-20">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='profile.html'">
          <img id="sideMyAvatar" src="profile.png" class="w-10 h-10 rounded-full object-cover border border-neutral-800" onerror="this.src='profile.png'">
          <div>
            <p id="sideMyName" class="font-bold text-xs text-white">User</p>
            <p id="sideMyUsername" class="text-neutral-500 text-[10px]">@username</p>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-neutral-400">Suggested for you</h3>
        </div>
        <div id="suggestedUsersContainer" class="space-y-3"></div>
      </div>
    </aside>

  </div>

  <!-- FIREBASE MODULE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, doc, getDoc, getDocs, onSnapshot, query, orderBy, addDoc, updateDoc, arrayUnion, arrayRemove, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const DEFAULT_AVATAR = "profile.png";
    window.allUsersMap = {};

    // Auth Change Listener
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        window.currentUser = user;
        await fetchAllUsers();
        await fetchCurrentUserData();

        listenToStories();
        listenToRealtimePosts();
        listenToRegisteredUsersSuggestions();
      }
    });

    // Logout
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) logoutBtn.onclick = () => signOut(auth);

    // Story Upload Trigger
    const myStoryBtn = document.getElementById('myStoryBtn');
    const storyInput = document.getElementById('storyInput');
    if (myStoryBtn && storyInput) {
      myStoryBtn.onclick = () => storyInput.click();
      storyInput.onchange = (e) => uploadStory(e);
    }

    // Scroll Controls
    const btnScrollLeft = document.getElementById('btnScrollLeft');
    const btnScrollRight = document.getElementById('btnScrollRight');
    const storiesWrapper = document.getElementById('storiesWrapper');

    if (btnScrollLeft && storiesWrapper) {
      btnScrollLeft.onclick = () => storiesWrapper.scrollBy({ left: -300, behavior: 'smooth' });
    }
    if (btnScrollRight && storiesWrapper) {
      btnScrollRight.onclick = () => storiesWrapper.scrollBy({ left: 300, behavior: 'smooth' });
    }

    // Fetch All Users Map
    async function fetchAllUsers() {
      const snap = await getDocs(collection(db, "users"));
      snap.forEach(docSnap => {
        window.allUsersMap[docSnap.id] = docSnap.data();
      });
    }

    // Fetch Current User Data
    async function fetchCurrentUserData() {
      const docSnap = await getDoc(doc(db, "users", window.currentUser.uid));
      if (docSnap.exists()) {
        window.currentUserData = docSnap.data();
        const avatar = window.currentUserData.photoURL || DEFAULT_AVATAR;
        const name = window.currentUserData.fullName || "User";
        const username = window.currentUserData.username || "user";

        if (document.getElementById('navMyAvatar')) document.getElementById('navMyAvatar').src = avatar;
        if (document.getElementById('myStoryAvatar')) document.getElementById('myStoryAvatar').src = avatar;
        if (document.getElementById('sideMyAvatar')) document.getElementById('sideMyAvatar').src = avatar;
        if (document.getElementById('sideMyName')) document.getElementById('sideMyName').innerText = name;
        if (document.getElementById('sideMyUsername')) document.getElementById('sideMyUsername').innerText = "@" + username;
      }
    }

    // STORY UPLOAD FUNCTION
    async function uploadStory(event) {
      const file = event.target.files[0];
      if (!file || !window.currentUser) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          await addDoc(collection(db, "stories"), {
            authorUid: window.currentUser.uid,
            authorName: window.currentUserData?.fullName || "User",
            media: e.target.result,
            createdAt: serverTimestamp()
          });
          alert("Story uploaded successfully!");
        } catch (error) {
          alert("Failed to upload story.");
        }
      };
      reader.readAsDataURL(file);
    }

    // LISTEN TO STORIES
    function listenToStories() {
      const myUid = window.currentUser.uid;
      const myFollowing = window.currentUserData?.following || [];

      const q = query(collection(db, "stories"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('storiesContainer');
        if (!container) return;
        container.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const s = docSnap.data();
          const storyId = docSnap.id;
          const authorUser = window.allUsersMap[s.authorUid] || {};

          if (s.authorUid === myUid) return;
          if (!myFollowing.includes(s.authorUid)) return;
          if (authorUser.isPrivate && !myFollowing.includes(s.authorUid)) return;

          const authorAvatar = authorUser.photoURL || DEFAULT_AVATAR;
          const authorName = authorUser.fullName || s.authorName || 'User';

          const storyDiv = document.createElement('div');
          storyDiv.className = "flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer";
          storyDiv.onclick = () => window.location.href = `story.html?storyId=${storyId}`;

          storyDiv.innerHTML = `
            <div class="w-16 h-16 rounded-full p-[2px] bg-gradient-to-tr from-yellow-500 via-red-500 to-purple-600 hover:scale-105 transition transform">
              <img src="${authorAvatar}" class="w-full h-full rounded-full object-cover border-2 border-black" onerror="this.src='${DEFAULT_AVATAR}'">
            </div>
            <span class="text-[11px] text-neutral-300 truncate w-16 text-center">${authorName}</span>
          `;
          container.appendChild(storyDiv);
        });
      });
    }

    // LISTEN TO FEED POSTS
    function listenToRealtimePosts() {
      const myUid = window.currentUser.uid;
      const myFollowing = window.currentUserData?.following || [];

      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedPostsContainer');
        if (!feed) return;
        feed.innerHTML = "";

        let visibleCount = 0;

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const authorUser = window.allUsersMap[post.authorUid] || {};

          if (authorUser.isPrivate && !myFollowing.includes(post.authorUid) && post.authorUid !== myUid) {
            return;
          }

          const shouldShow = myFollowing.length === 0 || post.authorUid === myUid || myFollowing.includes(post.authorUid) || !authorUser.isPrivate;

          if (shouldShow) {
            visibleCount++;
            const isLiked = post.likes && post.likes.includes(myUid);
            const likeCount = post.likes ? post.likes.length : 0;
            const authorPhoto = authorUser.photoURL || DEFAULT_AVATAR;
            const authorName = authorUser.fullName || post.authorName || 'User';

            let mediaHTML = "";
            if (post.media) {
              if (post.mediaType && post.mediaType.startsWith('video/')) {
                mediaHTML = `<video src="${post.media}" controls class="w-full rounded-lg max-h-[500px] object-cover mt-2 border border-neutral-900"></video>`;
              } else {
                mediaHTML = `<img src="${post.media}" class="w-full rounded-lg max-h-[500px] object-cover mt-2 border border-neutral-900">`;
              }
            }

            const postCard = document.createElement('div');
            postCard.className = "border-b border-neutral-900 pb-6 mb-6 space-y-3 max-w-[470px] mx-auto";
            postCard.innerHTML = `
              <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='profile.html?uid=${post.authorUid}'">
                  <div class="p-[1.5px] bg-gradient-to-tr from-yellow-500 to-purple-600 rounded-full">
                    <img src="${authorPhoto}" class="w-8 h-8 rounded-full object-cover border border-neutral-800" onerror="this.src='${DEFAULT_AVATAR}'">
                  </div>
                  <div class="flex items-center space-x-2">
                    <h4 class="text-xs font-bold text-white hover:underline">${authorName}</h4>
                  </div>
                </div>
              </div>

              ${mediaHTML}
              ${post.text ? `<p class="text-xs text-slate-200 mt-2">${post.text}</p>` : ''}

              <div class="flex items-center justify-between pt-1 text-white text-lg">
                <div class="flex items-center space-x-4">
                  <button onclick="window.toggleLikeFirebase('${postId}', ${isLiked})" class="${isLiked ? 'text-red-500' : 'hover:text-neutral-400'}">
                    <i class="${isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                  </button>
                  <i class="fa-regular fa-comment hover:text-neutral-400 cursor-pointer"></i>
                  <i class="fa-regular fa-paper-plane hover:text-neutral-400 cursor-pointer"></i>
                </div>
              </div>
              <p class="text-xs font-bold text-white">${likeCount} likes</p>
            `;
            feed.appendChild(postCard);
          }
        });

        if (visibleCount === 0) {
          feed.innerHTML = `<p class="text-xs text-neutral-500 text-center py-10">No posts available right now.</p>`;
        }
      });
    }

    // LIKE TOGGLE
    window.toggleLikeFirebase = async (postId, currentlyLiked) => {
      const postRef = doc(db, "posts", postId);
      if (currentlyLiked) {
        await updateDoc(postRef, { likes: arrayRemove(window.currentUser.uid) });
      } else {
        await updateDoc(postRef, { likes: arrayUnion(window.currentUser.uid) });
      }
    };

    // FOLLOW / REQUEST TOGGLE
    window.toggleFollowUser = async (targetUid) => {
      const myUid = window.currentUser.uid;
      const myFollowing = window.currentUserData?.following || [];
      const targetUser = window.allUsersMap[targetUid];

      if (!targetUser) return;

      const myDocRef = doc(db, "users", myUid);
      const targetDocRef = doc(db, "users", targetUid);

      const isFollowing = myFollowing.includes(targetUid);
      const isRequested = targetUser.followRequests && targetUser.followRequests.includes(myUid);

      if (isFollowing) {
        await updateDoc(myDocRef, { following: arrayRemove(targetUid) });
        await updateDoc(targetDocRef, { followers: arrayRemove(myUid) });
      } else if (isRequested) {
        await updateDoc(targetDocRef, { followRequests: arrayRemove(myUid) });
      } else {
        if (targetUser.isPrivate) {
          await updateDoc(targetDocRef, { followRequests: arrayUnion(myUid) });
          alert("Follow request sent!");
        } else {
          await updateDoc(myDocRef, { following: arrayUnion(targetUid) });
          await updateDoc(targetDocRef, { followers: arrayUnion(myUid) });
        }
      }
      await fetchCurrentUserData();
      listenToRegisteredUsersSuggestions();
    };

    // SUGGESTED USERS LIST
    function listenToRegisteredUsersSuggestions() {
      const container = document.getElementById('suggestedUsersContainer');
      if (!container) return;
      container.innerHTML = "";

      const myFollowing = window.currentUserData?.following || [];
      const myUid = window.currentUser.uid;

      Object.keys(window.allUsersMap).forEach((userId) => {
        if (userId !== myUid) {
          const user = window.allUsersMap[userId];
          const avatar = user.photoURL || DEFAULT_AVATAR;
          const name = user.fullName || 'User';
          const username = user.username || 'user';

          const isFollowing = myFollowing.includes(userId);
          const isRequested = user.followRequests && user.followRequests.includes(myUid);

          let btnText = "Follow";
          let btnClass = "text-blue-500";

          if (isFollowing) {
            btnText = "Following";
            btnClass = "text-neutral-500";
          } else if (isRequested) {
            btnText = "Requested";
            btnClass = "text-yellow-500";
          }

          const div = document.createElement('div');
          div.className = "flex items-center justify-between";
          div.innerHTML = `
            <div class="flex items-center space-x-3 cursor-pointer" onclick="window.location.href='profile.html?uid=${userId}'">
              <img src="${avatar}" class="w-8 h-8 rounded-full object-cover border border-neutral-800" onerror="this.src='${DEFAULT_AVATAR}'">
              <div>
                <p class="font-bold text-xs text-white hover:underline">${username}</p>
                <p class="text-neutral-500 text-[10px] truncate w-24">${name}</p>
              </div>
            </div>
            <button onclick="window.toggleFollowUser('${userId}')" class="${btnClass} hover:text-white font-bold text-xs">
              ${btnText}
            </button>
          `;
          container.appendChild(div);
        }
      });
    }
  </script>
</body>
</html>
