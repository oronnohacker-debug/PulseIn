<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Echoo — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-black text-slate-100 min-h-screen flex">

  <aside class="w-16 xl:w-60 border-r border-slate-800 h-screen sticky top-0 flex flex-col justify-between py-6 px-3 bg-black">
    <div class="space-y-8">
      <a href="index.html" class="px-3 flex items-center space-x-3"><i class="fa-solid fa-waveform text-cyan-400 text-2xl"></i><span class="hidden xl:inline text-xl font-bold font-mono">Echoo</span></a>
      <nav class="space-y-2">
        <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 transition"><i class="fa-solid fa-house text-xl"></i><span class="hidden xl:inline text-sm">Home</span></a>
        <a href="reels.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 transition"><i class="fa-solid fa-clapperboard text-xl"></i><span class="hidden xl:inline text-sm">Reels</span></a>
        <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 transition"><i class="fa-regular fa-paper-plane text-xl"></i><span class="hidden xl:inline text-sm">Messages</span></a>
        <a href="dashboard.html" class="flex items-center space-x-4 p-3 rounded-xl bg-slate-900 text-cyan-400 font-bold"><i class="fa-solid fa-chart-line text-xl"></i><span class="hidden xl:inline text-sm">Dashboard</span></a>
        <a href="settings.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 transition"><i class="fa-solid fa-gear text-xl"></i><span class="hidden xl:inline text-sm">Settings</span></a>
      </nav>
    </div>
  </aside>

  <main class="flex-1 max-w-4xl mx-auto p-8 space-y-6">
    <h1 class="text-xl font-bold">Real-time Creator Dashboard</h1>
    
    <div class="grid grid-cols-2 gap-4">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <p id="totalPostsCount" class="text-3xl font-black text-cyan-400">0</p>
        <p class="text-xs text-slate-400 mt-1">Total Posts Published</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <p id="totalLikesCount" class="text-3xl font-black text-blue-400">0</p>
        <p class="text-xs text-slate-400 mt-1">Total Likes Received</p>
      </div>
    </div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
