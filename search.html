<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8"><title>Search — PulseIn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-black text-slate-100 min-h-screen flex">
  <div class="max-w-2xl mx-auto flex-1 p-6 space-y-6">
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
      <input type="text" placeholder="Search people, posts, topics..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-12 pr-4 py-3 text-xs focus:outline-none focus:border-cyan-500">
    </div>
    <div class="grid grid-cols-3 gap-2">
      <img src="https://picsum.photos/300/300?random=1" class="rounded-xl aspect-square object-cover">
      <img src="https://picsum.photos/300/300?random=2" class="rounded-xl aspect-square object-cover">
      <img src="https://picsum.photos/300/300?random=3" class="rounded-xl aspect-square object-cover">
    </div>
  </div>
</body>
</html>
