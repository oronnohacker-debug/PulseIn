<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .sidebar { width: 72px; transition: width 0.25s ease-in-out; }
    .sidebar:hover { width: 240px; }
    .sidebar:hover .nav-text { display: inline-block; }
    .nav-text { display: none; white-space: nowrap; }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex antialiased select-none relative">

  <!-- LEFT NAVIGATION SIDEBAR -->
  <aside class="sidebar fixed top-0 left-0 h-screen bg-black border-r border-slate-800 flex flex-col justify-between py-6 px-3 z-40">
    <div class="space-y-6">
      <a href="index.html" class="flex items-center space-x-4 px-3 py-2 text-cyan-400">
        <i class="fa-solid fa-bolt text-2xl"></i>
        <span class="nav-text text-xl font-bold tracking-wider text-white">PulseIn</span>
      </a>

      <nav class="space-y-2">
        <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl bg-slate-900 text-cyan-400 font-bold">
          <i class="fa-solid fa-house text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Home</span>
        </a>
        <a href="search.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-solid fa-magnifying-glass text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Search</span>
        </a>
        <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-paper-plane text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Messages</span>
        </a>
        <a href="notifications.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-heart text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Notifications</span>
        </a>
        <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-user text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">My Profile</span>
        </a>
      </nav>
    </div>

    <div class="space-y-2 border-t border-slate-800 pt-4">
      <a href="login.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-red-400">
        <i class="fa-solid fa-right-from-bracket text-xl w-6 text-center"></i>
        <span class="nav-text text-sm">Log Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <div class="pl-20 flex-1 flex justify-center max-w-7xl mx-auto px-4 py-6 gap-8">

    <!-- FEED SECTION -->
    <main class="w-full max-w-xl space-y-6">

      <!-- STORIES ROW -->
      <div class="flex space-x-4 overflow-x-auto pb-3 border-b border-slate-800">
        <a href="create-story.html" class="flex-shrink-0 text-center cursor-pointer group">
          <div class="w-16 h-16 rounded-full border-2 border-dashed border-cyan-400 p-0.5 flex items-center justify-center bg-slate-900 group-hover:scale-105 transition">
            <i class="fa-solid fa-plus text-cyan-400 text-xl"></i>
          </div>
          <span class="text-[11px] text-slate-300 font-medium mt-1 block">Add Story</span>
        </a>
      </div>

      <!-- CREATE POST BOX -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center space-x-3">
          <!-- Default SVG Avatar Icon (No random photo) -->
          <div class="w-9 h-9 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-slate-400">
            <i class="fa-solid fa-user text-sm"></i>
          </div>
          <input type="text" id="postInputText" placeholder="What's on your mind?" class="w-full bg-slate-800/80 border border-slate-700/60 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-cyan-500">
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
          <div class="flex space-x-4 text-slate-400 text-xs">
            <label class="cursor-pointer hover:text-cyan-400 flex items-center space-x-1">
              <i class="fa-regular fa-image text-base"></i><span>Photo</span>
              <input type="file" id="postPhotoInput" accept="image/*" class="hidden">
            </label>
            <label class="cursor-pointer hover:text-cyan-400 flex items-center space-x-1">
              <i class="fa-solid fa-video text-base"></i><span>Video</span>
              <input type="file" id="postVideoInput" accept="video/*" class="hidden">
            </label>
          </div>
          <button class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-4 py-1.5 rounded-xl text-xs transition">Post</button>
        </div>
      </div>

      <!-- NO POSTS PLACEHOLDER -->
      <div class="text-center py-12 border border-slate-800/60 rounded-2xl bg-slate-950">
        <i class="fa-solid fa-border-all text-3xl text-slate-600 mb-2"></i>
        <p class="text-xs text-slate-400">No posts available right now.</p>
      </div>

    </main>

    <!-- RIGHT PANEL: CURRENT USER & REAL SUGGESTION LOGIC -->
    <aside class="hidden lg:block w-80 space-y-6 pt-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <!-- Text Initials instead of fake photo -->
          <div class="w-11 h-11 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-sm border border-slate-700">
            OB
          </div>
          <div>
            <p class="text-xs font-bold text-slate-100">oron.broh</p>
            <p class="text-[11px] text-slate-400">Oronno</p>
          </div>
        </div>
        <a href="login.html" class="text-xs font-bold text-cyan-400 hover:underline">Switch</a>
      </div>

      <div class="border-t border-slate-800/80 pt-4 space-y-3">
        <span class="text-xs font-bold text-slate-400 block">Suggested for you</span>
        <!-- Clean Empty State for Suggestions -->
        <div class="p-4 bg-slate-900/40 border border-slate-800 rounded-2xl text-center space-y-2">
          <i class="fa-solid fa-user-plus text-slate-600 text-xl"></i>
          <p class="text-[11px] text-slate-400">No suggested accounts found.</p>
          <a href="search.html" class="inline-block text-[11px] font-bold text-cyan-400 hover:underline">Search People</a>
        </div>
      </div>
    </aside>

  </div>

  <!-- FLOATING BOTTOM MESSAGES BAR (1ST PIC STYLE) -->
  <div onclick="toggleChatPopup()" class="fixed bottom-4 right-6 z-40 flex items-center space-x-3 bg-slate-900 border border-slate-800 px-4 py-2.5 rounded-full shadow-2xl cursor-pointer hover:bg-slate-800 transition">
    <div class="relative">
      <i class="fa-regular fa-paper-plane text-cyan-400 text-lg"></i>
    </div>
    <span class="text-xs font-bold text-slate-100">Messages</span>
  </div>

  <!-- FLOATING CHAT POPUP DRAWER (2ND PIC POPUP) -->
  <div id="chatDrawerPopup" class="hidden fixed bottom-4 right-6 z-50 w-80 sm:w-86 h-[450px] bg-slate-900 border border-slate-800 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
    <!-- Header -->
    <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
      <h3 class="font-bold text-sm">Messages</h3>
      <button onclick="toggleChatPopup()" class="hover:text-white text-slate-400"><i class="fa-solid fa-xmark text-base"></i></button>
    </div>

    <!-- Active Chat Box List -->
    <div class="flex-1 overflow-y-auto p-4 flex flex-col justify-center items-center text-center space-y-2 text-slate-500">
      <i class="fa-regular fa-comments text-3xl"></i>
      <p class="text-xs">No active conversations yet.</p>
      <a href="messages.html" class="text-xs text-cyan-400 font-bold hover:underline">Open Full DM Page</a>
    </div>
  </div>

  <script>
    function toggleChatPopup() {
      const popup = document.getElementById('chatDrawerPopup');
      popup.classList.toggle('hidden');
    }
  </script>
</body>
</html>
