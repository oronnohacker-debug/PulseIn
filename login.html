<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      RecaptchaVerifier, 
      signInWithPhoneNumber 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035",
      measurementId: "G-N8L551KYDP"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // চেক করবে ইউজার প্রোফাইল সেটআপ করেছে নাকি নতুন
    async function checkUserProfile(user) {
      const userRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(userRef);

      if (docSnap.exists()) {
        window.location.href = "index.html"; // প্রোফাইল থাকলে হোম পেজ
      } else {
        window.location.href = "setup-profile.html"; // নতুন ইউজার হলে সেটআপ পেজ
      }
    }

    window.loginWithGoogle = async () => {
      const provider = new GoogleAuthProvider();
      try {
        const result = await signInWithPopup(auth, provider);
        await checkUserProfile(result.user);
      } catch (error) {
        alert("Google Sign-In Error: " + error.message);
      }
    };

    let confirmationResultGlobal = null;

    window.sendPhoneOtp = async () => {
      const phone = document.getElementById('phoneInput').value.trim();
      if (!phone) {
        alert("Please enter a valid phone number (+8801XXXXXXXXX)!");
        return;
      }

      if (!window.recaptchaVerifier) {
        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { 'size': 'invisible' });
      }

      try {
        confirmationResultGlobal = await signInWithPhoneNumber(auth, phone, window.recaptchaVerifier);
        document.getElementById('phoneOtpBox').classList.remove('hidden');
      } catch (error) {
        alert("Phone Auth Error: " + error.message);
      }
    };

    window.verifyPhoneOtp = async () => {
      const code = document.getElementById('otpInput').value.trim();
      try {
        const result = await confirmationResultGlobal.confirm(code);
        await checkUserProfile(result.user);
      } catch (error) {
        alert("Invalid Code!");
      }
    };
  </script>
</head>
<body class="bg-black text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans select-none">

  <div id="recaptcha-container"></div>

  <div class="w-full max-w-md bg-[#121212] border border-neutral-800 rounded-3xl p-8 space-y-6 shadow-2xl">
    
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold text-white">PulseIn</h1>
      <p class="text-xs text-neutral-400">Sign in or create an account</p>
    </div>

    <!-- GOOGLE LOGIN -->
    <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center space-x-3 bg-neutral-900 border border-neutral-800 hover:bg-neutral-800 text-white font-medium py-3 rounded-2xl text-xs transition">
      <i class="fa-brands fa-google text-red-400 text-base"></i>
      <span>Continue with Google</span>
    </button>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-neutral-800"></div>
      <span class="flex-shrink mx-4 text-neutral-500 text-[11px] uppercase">OR</span>
      <div class="flex-grow border-t border-neutral-800"></div>
    </div>

    <!-- PHONE LOGIN -->
    <div class="space-y-4">
      <div>
        <label class="text-[11px] text-neutral-400 mb-1 block">Phone Number</label>
        <input type="tel" id="phoneInput" placeholder="+8801XXXXXXXXX" class="w-full bg-black border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-cyan-500">
      </div>

      <button onclick="sendPhoneOtp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
        Send Verification Code
      </button>

      <div id="phoneOtpBox" class="hidden space-y-3 pt-2 border-t border-neutral-800">
        <input type="text" id="otpInput" placeholder="Enter 6-digit Code" class="w-full bg-black border border-neutral-800 rounded-xl px-3 py-2.5 text-xs text-center text-white focus:outline-none">
        <button onclick="verifyPhoneOtp()" class="w-full bg-cyan-600 text-white font-bold py-2.5 rounded-xl text-xs">Verify & Continue</button>
      </div>
    </div>

  </div>

</body>
</html>
