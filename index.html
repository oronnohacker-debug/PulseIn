<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp, updateDoc, arrayUnion, arrayRemove, getDocs, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCPjBq74KCEgeO4MK6EZFjMuA3ju3s3Wpc",
      authDomain: "echoo-325d4.firebaseapp.com",
      projectId: "echoo-325d4",
      storageBucket: "echoo-325d4.firebasestorage.app",
      messagingSenderId: "694671555312",
      appId: "1:694671555312:web:12b3bdf72ff02943eba035"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.currentUser = null;
    window.currentUserData = null;
    window.selectedMediaBase64 = null;
    window.selectedMediaType = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        window.currentUser = user;
        const userDoc = await getDoc(doc(db, "users", user.uid));
        if (userDoc.exists()) {
          window.currentUserData = userDoc.data();
          updateUIWithUserData(window.currentUserData);
          listenToRealtimePosts();
        } else {
          window.location.href = "setup-profile.html";
        }
      }
    });

    function updateUIWithUserData(data) {
      document.getElementById('myStoryAvatar').src = data.photoURL || 'https://via.placeholder.com/150';
    }

    // Realtime Feed
    function listenToRealtimePosts() {
      const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
      onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feedPostsContainer');
        feed.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const isLiked = post.likes && post.likes.includes(window.currentUser.uid);
          const likeCount = post.likes ? post.likes.length : 0;
          const isMyPost = post.authorUid === window.currentUser.uid;

          let mediaHTML = "";
          if (post.media) {
            if (post.mediaType && post.mediaType.startsWith('video/')) {
              mediaHTML = `<video src="${post.media}" controls class="w-full rounded-xl max-h-96 object-cover border border-neutral-800 mt-2"></video>`;
            } else {
              mediaHTML = `<img src="${post.media}" class="w-full rounded-xl max-h-96 object-cover border border-neutral-800 mt-2">`;
            }
          }

          let audioHTML = "";
          if (post.songUrl) {
            audioHTML = `
              <div class="flex items-center space-x-2 bg-neutral-900 p-2 rounded-xl border border-neutral-800 text-xs text-yellow-400 mt-2">
                <i class="fa-solid fa-music animate-pulse"></i>
                <span class="font-semibold truncate">${post.songTitle || 'Audio Track'}</span>
                <audio src="${post.songUrl}" controls class="h-6 w-36 ml-auto"></audio>
              </div>
            `;
          }

          const authorAvatar = post.authorPhoto 
            ? `<img src="${post.authorPhoto}" class="w-9 h-9 rounded-full object-cover border border-neutral-700">`
            : `<div class="w-9 h-9 rounded-full bg-yellow-500 text-black font-bold flex items-center justify-center text-xs border border-neutral-700">${(post.authorName || 'U').substring(0, 2).toUpperCase()}</div>`;

          const postCard = document.createElement('div');
          postCard.className = "bg-[#121212] border border-neutral-800 rounded-2xl p-4 space-y-3";
          postCard.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3">
                ${authorAvatar}
                <div>
                  <h4 class="text-xs font-bold text-white">${post.authorName || 'User'}</h4>
                  <p class="text-[10px] text-neutral-400">@${post.username || 'user'}</p>
                </div>
              </div>
              ${isMyPost ? `
                <button onclick="window.deletePost('${postId}')" class="text-neutral-500 hover:text-red-500 text-xs">
                  <i class="fa-solid fa-trash"></i>
                </button>
              ` : ''}
            </div>

            ${post.text ? `<p class="text-xs text-slate-200 leading-relaxed">${post.text}</p>` : ''}
            ${audioHTML}
            ${mediaHTML}

            <div class="flex items-center justify-between pt-2 border-t border-neutral-800 text-neutral-400 text-sm">
              <button onclick="window.toggleLikeFirebase('${postId}', ${isLiked})" class="flex items-center space-x-1.5 ${isLiked ? 'text-red-500 font-bold' : ''}">
                <i class="${isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                <span class="text-xs">${likeCount}</span>
              </button>
              <button onclick="window.toggleCommentBox('${postId}')" class="flex items-center space-x-1.5">
                <i class="fa-regular fa-comment"></i>
                <span class="text-xs" id="commentCount-${postId}">0</span>
              </button>
              <button class="flex items-center space-x-1 text-xs"><i class="fa-regular fa-paper-plane"></i></button>
            </div>

            <!-- COMMENTS BOX -->
            <div id="commentSection-${postId}" class="hidden pt-3 border-t border-neutral-800/80 space-y-3">
              <div id="commentsList-${postId}" class="space-y-2 max-h-48 overflow-y-auto"></div>
              
              <!-- Input with GIF & Image Button -->
              <div class="flex items-center space-x-2">
                <input type="text" id="commentInput-${postId}" placeholder="Write a comment..." class="flex-1 bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-1.5 text-xs text-white focus:outline-none focus:border-yellow-400">
                
                <button onclick="alert('Select a GIF')" class="text-yellow-400 bg-neutral-800 hover:bg-neutral-700 px-2 py-1 rounded-lg text-xs font-bold">GIF</button>
                <label class="cursor-pointer text-neutral-400 hover:text-yellow-400">
                  <i class="fa-regular fa-image text-sm"></i>
                  <input type="file" class="hidden" accept="image/*" onchange="alert('Image selected for comment')">
                </label>

                <button onclick="window.sendTextComment('${postId}')" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold px-3 py-1.5 rounded-xl text-xs">Send</button>
              </div>
            </div>
          `;
          feed.appendChild(postCard);
          window.listenToComments(postId);
        });
      });
    }

    window.toggleCommentBox = (postId) => {
      document.getElementById(`commentSection-${postId}`).classList.toggle('hidden');
    };

    window.listenToComments = (postId) => {
      const commentsRef = collection(db, "posts", postId, "comments");
      const q = query(commentsRef, orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const list = document.getElementById(`commentsList-${postId}`);
        const countSpan = document.getElementById(`commentCount-${postId}`);
        if (!list) return;
        list.innerHTML = "";
        countSpan.innerText = snapshot.size;

        snapshot.forEach((docSnap) => {
          const c = docSnap.data();
          const item = document.createElement('div');
          item.className = "bg-neutral-900 p-2 rounded-xl text-xs space-y-1 border border-neutral-800/60";
          item.innerHTML = `<span class="font-bold text-yellow-400">${c.authorName}</span><p class="text-slate-200">${c.text}</p>`;
          list.appendChild(item);
        });
      });
    };

    window.sendTextComment = async (postId) => {
      const input = document.getElementById(`commentInput-${postId}`);
      const val = input.value.trim();
      if (!val) return;

      await addDoc(collection(db, "posts", postId, "comments"), {
        text: val,
        authorName: window.currentUserData.fullName || "User",
        createdAt: serverTimestamp()
      });
      input.value = "";
    };

    window.toggleLikeFirebase = async (postId, currentlyLiked) => {
      const postRef = doc(db, "posts", postId);
      if (currentlyLiked) {
        await updateDoc(postRef, { likes: arrayRemove(window.currentUser.uid) });
      } else {
        await updateDoc(postRef, { likes: arrayUnion(window.currentUser.uid) });
      }
    };

    window.deletePost = async (postId) => {
      if (confirm("Delete this post?")) await deleteDoc(doc(db, "posts", postId));
    };

    window.publishPost = async () => {
      const text = document.getElementById('postInputText').value.trim();
      const songUrl = document.getElementById('postSongSelect').value;
      const songTitle = document.getElementById('postSongSelect').options[document.getElementById('postSongSelect').selectedIndex].text;

      if (!text && !window.selectedMediaBase64) {
        alert("Please write something or select media!");
        return;
      }

      await addDoc(collection(db, "posts"), {
        type: 'post',
        text: text,
        media: window.selectedMediaBase64 || null,
        mediaType: window.selectedMediaType || null,
        songUrl: songUrl || null,
        songTitle: songUrl ? songTitle : null,
        authorUid: window.currentUser.uid,
        authorName: window.currentUserData.fullName || "User",
        authorPhoto: window.currentUserData.photoURL || null,
        username: window.currentUserData.username || "user",
        likes: [],
        createdAt: serverTimestamp()
      });

      document.getElementById('postInputText').value = "";
      window.closeCreatePostModal();
    };

    window.previewMedia = (e) => {
      const file = e.target.files[0];
      if (file) {
        window.selectedMediaType = file.type;
        const reader = new FileReader();
        reader.onload = (evt) => {
          window.selectedMediaBase64 = evt.target.result;
          document.getElementById('mediaPreviewHolder').innerHTML = `<img src="${evt.target.result}" class="w-full max-h-48 object-cover rounded-xl mt-2">`;
        };
        reader.readAsDataURL(file);
      }
    };

    window.openCreatePostModal = () => document.getElementById('createPostModal').classList.remove('hidden');
    window.closeCreatePostModal = () => document.getElementById('createPostModal').classList.add('hidden');
  </script>
</head>
<body class="bg-black text-slate-100 min-h-screen font-sans pb-20 md:pb-0 select-none">

  <!-- TOP HEADER (Mobile Friendly) -->
  <header class="flex md:hidden items-center justify-between p-4 border-b border-neutral-800 sticky top-0 bg-black/90 backdrop-blur z-40">
    <h1 class="text-xl font-bold tracking-wider text-yellow-400">PulseIn</h1>
    <a href="messages.html" class="text-slate-300 text-lg"><i class="fa-regular fa-paper-plane"></i></a>
  </header>

  <div class="flex max-w-6xl mx-auto">
    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex w-64 fixed top-0 left-0 h-screen bg-black border-r border-neutral-800 flex-col justify-between p-4 z-50">
      <div class="space-y-6">
        <h1 class="text-2xl font-bold text-yellow-400 tracking-wider">PulseIn</h1>
        <nav class="space-y-2">
          <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl bg-neutral-900 text-yellow-400 font-bold"><i class="fa-solid fa-house"></i><span>Home</span></a>
          <a href="upload-reel.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-slate-300"><i class="fa-solid fa-clapperboard"></i><span>Create Reel</span></a>
          <button onclick="openCreatePostModal()" class="w-full flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-yellow-400 font-bold"><i class="fa-regular fa-square-plus"></i><span>Create Post</span></button>
          <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-slate-300"><i class="fa-regular fa-paper-plane"></i><span>Messages</span></a>
          <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-neutral-900 text-slate-300"><i class="fa-regular fa-user"></i><span>Profile</span></a>
        </nav>
      </div>
    </aside>

    <!-- MAIN FEED AREA -->
    <main class="flex-1 md:ml-64 max-w-lg mx-auto p-4 space-y-6">
      
      <!-- STORIES SECTION -->
      <div class="flex space-x-4 overflow-x-auto pb-2 scrollbar-none border-b border-neutral-800/80">
        <!-- Add Story -->
        <div class="flex flex-col items-center space-y-1 flex-shrink-0 cursor-pointer" onclick="alert('Upload Story Coming Soon!')">
          <div class="relative w-14 h-14 rounded-full p-[2px] bg-neutral-800 border-2 border-dashed border-yellow-400 flex items-center justify-center">
            <img id="myStoryAvatar" class="w-full h-full rounded-full object-cover">
            <div class="absolute bottom-0 right-0 bg-yellow-400 text-black text-[10px] rounded-full w-4 h-4 flex items-center justify-center font-bold">+</div>
          </div>
          <span class="text-[10px] text-neutral-400">Your Story</span>
        </div>
      </div>

      <!-- POSTS FEED -->
      <div id="feedPostsContainer" class="space-y-6"></div>
    </main>
  </div>

  <!-- BOTTOM NAVIGATION FOR MOBILE -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-black/95 border-t border-neutral-800 flex justify-around p-3 z-50 text-slate-400 text-lg">
    <a href="index.html" class="text-yellow-400"><i class="fa-solid fa-house"></i></a>
    <a href="upload-reel.html"><i class="fa-solid fa-clapperboard"></i></a>
    <button onclick="openCreatePostModal()"><i class="fa-regular fa-square-plus text-yellow-400 text-xl"></i></button>
    <a href="messages.html"><i class="fa-regular fa-paper-plane"></i></a>
    <a href="profile.html"><i class="fa-regular fa-user"></i></a>
  </nav>

  <!-- CREATE POST MODAL WITH MUSIC & MEDIA -->
  <div id="createPostModal" class="hidden fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
    <div class="bg-[#121212] border border-neutral-800 rounded-2xl w-full max-w-md p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-neutral-800 pb-2">
        <h3 class="text-xs font-bold text-white">Create Post with Photo & Music</h3>
        <button onclick="closeCreatePostModal()" class="text-neutral-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <textarea id="postInputText" rows="3" placeholder="Write a caption..." class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-yellow-400 resize-none"></textarea>

      <!-- Music Add Option -->
      <div class="bg-neutral-900 p-2.5 rounded-xl border border-neutral-800 space-y-1">
        <label class="text-[10px] font-bold text-yellow-400 block"><i class="fa-solid fa-music"></i> Add Background Music:</label>
        <select id="postSongSelect" class="w-full bg-black border border-neutral-700 text-xs rounded-lg p-2 text-slate-200 focus:outline-none">
          <option value="">No Music</option>
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Trending Audio - Vibe 1</option>
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Pop Chill Beats 2</option>
          <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Acoustic Lo-Fi 3</option>
        </select>
      </div>

      <div id="mediaPreviewHolder"></div>

      <div class="flex items-center justify-between pt-2 border-t border-neutral-800">
        <label class="cursor-pointer text-xs text-yellow-400 flex items-center space-x-1.5">
          <i class="fa-regular fa-image text-base"></i>
          <span>Add Photo/Video</span>
          <input type="file" accept="image/*,video/*" onchange="previewMedia(event)" class="hidden">
        </label>
        <button onclick="publishPost()" class="bg-yellow-400 text-black font-bold px-5 py-1.5 rounded-xl text-xs hover:bg-yellow-300">Publish</button>
      </div>
    </div>
  </div>

</body>
</html>
