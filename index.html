<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseIn — Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-black text-slate-100 min-h-screen flex font-sans select-none">

  <!-- LEFT NAVIGATION SIDEBAR (ALWAYS VISIBLE TEXT) -->
  <aside class="w-64 fixed top-0 left-0 h-screen bg-black border-r border-slate-800 flex flex-col justify-between p-4 z-40">
    <div class="space-y-6">
      <!-- EAGLE LOGO & BRAND NAME -->
      <a href="index.html" class="flex items-center space-x-3 px-2 py-1">
        <!-- Replace 'logo.png' with your eagle logo file -->
        <img src="logo.png" alt="PulseIn Logo" class="w-9 h-9 object-contain">
        <span class="text-xl font-bold tracking-wider text-white">PulseIn</span>
      </a>

      <!-- MENU ITEMS WITH LABELS -->
      <nav class="space-y-1.5">
        <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl bg-slate-900 text-cyan-400 font-bold">
          <i class="fa-solid fa-house text-xl w-6 text-center"></i>
          <span class="text-sm">Home</span>
        </a>
        <a href="search.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-solid fa-magnifying-glass text-xl w-6 text-center"></i>
          <span class="text-sm">Search</span>
        </a>
        <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-paper-plane text-xl w-6 text-center"></i>
          <span class="text-sm">Messages</span>
        </a>
        <a href="notifications.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-heart text-xl w-6 text-center"></i>
          <span class="text-sm">Notifications</span>
        </a>
        <!-- CREATE POST BUTTON -->
        <button onclick="document.getElementById('postInputText').focus()" class="w-full flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-square-plus text-xl w-6 text-center"></i>
          <span class="text-sm">Create</span>
        </button>
        <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-user text-xl w-6 text-center"></i>
          <span class="text-sm">Profile</span>
        </a>
      </nav>
    </div>

    <!-- LOGOUT -->
    <div class="border-t border-slate-800 pt-3">
      <a href="login.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-red-400 font-semibold">
        <i class="fa-solid fa-right-from-bracket text-xl w-6 text-center"></i>
        <span class="text-sm">Log Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN FEED CONTAINER -->
  <div class="pl-64 flex-1 flex justify-center max-w-6xl mx-auto px-6 py-6 gap-8">

    <main class="w-full max-w-lg space-y-6">

      <!-- CREATE POST BOX (WORKING FUNCTIONALITY) -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-xs border border-slate-700 flex-shrink-0">
            OB
          </div>
          <input type="text" id="postInputText" placeholder="What's on your mind?" class="w-full bg-slate-800 border border-slate-700/70 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-cyan-500 text-white">
        </div>

        <!-- IMAGE PREVIEW CONTAINER -->
        <div id="imagePreviewContainer" class="hidden relative rounded-xl overflow-hidden max-h-60 border border-slate-700">
          <img id="imagePreview" src="" class="w-full object-cover">
          <button onclick="removeImage()" class="absolute top-2 right-2 bg-black/70 text-white rounded-full p-1 w-6 h-6 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-slate-800">
          <div class="flex space-x-4 text-slate-400 text-xs">
            <label class="cursor-pointer hover:text-cyan-400 flex items-center space-x-1.5">
              <i class="fa-regular fa-image text-base text-cyan-400"></i>
              <span>Photo</span>
              <input type="file" id="postPhotoInput" accept="image/*" onchange="previewSelectedImage(event)" class="hidden">
            </label>
          </div>
          <button onclick="createNewPost()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-5 py-1.5 rounded-xl text-xs transition">Post</button>
        </div>
      </div>

      <!-- DYNAMIC FEED POSTS CONTAINER -->
      <div id="feedPostsContainer" class="space-y-6">
        <!-- Working posts will load here -->
      </div>

    </main>

  </div>

  <!-- JAVASCRIPT FOR REAL-TIME POSTING LOGIC -->
  <script>
    let selectedImageBase64 = "";

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageBase64 = e.target.result;
          document.getElementById('imagePreview').src = selectedImageBase64;
          document.getElementById('imagePreviewContainer').classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    function removeImage() {
      selectedImageBase64 = "";
      document.getElementById('postPhotoInput').value = "";
      document.getElementById('imagePreviewContainer').classList.add('hidden');
    }

    function createNewPost() {
      const text = document.getElementById('postInputText').value.trim();
      
      if (!text && !selectedImageBase64) {
        alert("Please enter some text or select an image to post!");
        return;
      }

      const feed = document.getElementById('feedPostsContainer');
      const postCard = document.createElement('div');
      postCard.className = "bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3";

      let imageHTML = selectedImageBase64 ? `<img src="${selectedImageBase64}" class="w-full rounded-xl object-cover max-h-96 border border-slate-800">` : '';

      postCard.innerHTML = `
        <div class="flex items-center space-x-3">
          <div class="w-9 h-9 rounded-full bg-cyan-600 text-white font-bold flex items-center justify-center text-xs border border-slate-700">
            OB
          </div>
          <div>
            <p class="text-xs font-bold text-white">oron.broh</p>
            <p class="text-[10px] text-slate-400">Just now</p>
          </div>
        </div>
        ${text ? `<p class="text-xs text-slate-200 leading-relaxed">${text}</p>` : ''}
        ${imageHTML}
        <div class="flex items-center space-x-6 pt-2 border-t border-slate-800/60 text-slate-400 text-sm">
          <button class="hover:text-red-500 flex items-center space-x-1.5"><i class="fa-regular fa-heart"></i><span class="text-xs">0</span></button>
          <button class="hover:text-cyan-400 flex items-center space-x-1.5"><i class="fa-regular fa-comment"></i><span class="text-xs">0</span></button>
          <button class="hover:text-cyan-400"><i class="fa-regular fa-paper-plane"></i></button>
        </div>
      `;

      feed.prepend(postCard);

      // Reset form
      document.getElementById('postInputText').value = "";
      removeImage();
    }
  </script>
</body>
</html>
