<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoo — Home</title>
  <!-- Favicon Logo (3rd Image Eagle) -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/L50H0sD/eagle-logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    /* Expand Sidebar on Hover like Instagram */
    .sidebar { width: 72px; transition: width 0.25s ease-in-out; }
    .sidebar:hover { width: 240px; }
    .sidebar:hover .nav-text { display: inline-block; }
    .nav-text { display: none; white-space: nowrap; }
  </style>
</head>
<body class="bg-black text-slate-100 min-h-screen flex antialiased">

  <!-- COLLAPSIBLE LEFT SIDEBAR (IG STYLE) -->
  <aside class="sidebar fixed top-0 left-0 h-screen bg-black border-r border-slate-800 flex flex-col justify-between py-6 px-3 z-50">
    <div class="space-y-6">
      <!-- Logo Home Redirect -->
      <a href="index.html" class="flex items-center space-x-4 px-3 py-2">
        <i class="fa-solid fa-feather-pointed text-2xl text-cyan-400"></i>
        <span class="nav-text text-xl font-bold font-mono tracking-wider">Echoo</span>
      </a>

      <!-- Navigation List -->
      <nav class="space-y-2">
        <a href="index.html" class="flex items-center space-x-4 p-3 rounded-xl bg-slate-900 text-cyan-400 font-bold hover:bg-slate-800">
          <i class="fa-solid fa-house text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Home</span>
        </a>
        <a href="search.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-solid fa-magnifying-glass text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Search</span>
        </a>
        <a href="reels.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-solid fa-clapperboard text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Reels</span>
        </a>
        <a href="messages.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300 relative">
          <i class="fa-regular fa-paper-plane text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Messages</span>
          <span class="absolute top-2 left-6 w-2.5 h-2.5 bg-red-500 rounded-full"></span>
        </a>
        <a href="notifications.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-heart text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Notifications</span>
        </a>
        <a href="dashboard.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-solid fa-chart-line text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">Dashboard</span>
        </a>
        <a href="profile.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
          <i class="fa-regular fa-user text-xl w-6 text-center"></i>
          <span class="nav-text text-sm">My Profile</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Settings & Switch -->
    <div class="space-y-2 border-t border-slate-800 pt-4">
      <a href="settings.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-slate-300">
        <i class="fa-solid fa-gear text-xl w-6 text-center"></i>
        <span class="nav-text text-sm">Settings</span>
      </a>
      <a href="login.html" class="flex items-center space-x-4 p-3 rounded-xl hover:bg-slate-900 text-red-400">
        <i class="fa-solid fa-right-from-bracket text-xl w-6 text-center"></i>
        <span class="nav-text text-sm">Log Out</span>
      </a>
    </div>
  </aside>

  <!-- MAIN BODY LAYOUT -->
  <div class="pl-20 flex-1 flex justify-center max-w-7xl mx-auto px-4 py-6 gap-8">

    <!-- FEED MAIN COLUMN -->
    <main class="w-full max-w-xl space-y-6">

      <!-- STORIES BAR -->
      <div class="flex space-x-4 overflow-x-auto pb-3 border-b border-slate-800">
        <!-- Add Story Button (Redirects to Create Story Page) -->
        <a href="create-story.html" class="flex-shrink-0 text-center cursor-pointer group">
          <div class="w-16 h-16 rounded-full border-2 border-dashed border-cyan-400 p-0.5 flex items-center justify-center bg-slate-900 group-hover:scale-105 transition">
            <i class="fa-solid fa-plus text-cyan-400 text-xl"></i>
          </div>
          <span class="text-[11px] text-slate-300 font-medium mt-1 block">Add Story</span>
        </a>
        <!-- Story Items Example -->
        <div class="flex space-x-4" id="storiesList">
          <div class="flex-shrink-0 text-center cursor-pointer">
            <div class="w-16 h-16 rounded-full border-2 border-pink-500 p-0.5">
              <img src="https://i.pravatar.cc/100?img=12" class="w-full h-full rounded-full object-cover">
            </div>
            <span class="text-[11px] text-slate-400 mt-1 block">alex_22</span>
          </div>
        </div>
      </div>

      <!-- CREATE POST BOX -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 space-y-3">
        <div class="flex items-center space-x-3">
          <img src="https://i.pravatar.cc/100?img=33" class="w-9 h-9 rounded-full">
          <input type="text" placeholder="What is on your mind?" class="w-full bg-slate-800/80 border border-slate-700/60 rounded-xl px-4 py-2 text-xs focus:outline-none focus:border-cyan-500">
        </div>
        <div class="flex items-center justify-between pt-2 border-t border-slate-800/80">
          <div class="flex space-x-4 text-slate-400 text-xs">
            <label class="cursor-pointer hover:text-cyan-400 flex items-center space-x-1">
              <i class="fa-regular fa-image text-base"></i><span>Photo</span>
              <input type="file" accept="image/*" class="hidden">
            </label>
            <button class="hover:text-cyan-400 flex items-center space-x-1"><i class="fa-solid fa-video text-base"></i><span>Video</span></button>
            <button class="hover:text-cyan-400 flex items-center space-x-1"><i class="fa-regular fa-face-smile text-base"></i><span>Feeling</span></button>
          </div>
          <button class="bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-4 py-1.5 rounded-xl text-xs transition">Post</button>
        </div>
      </div>

      <!-- POST FEED CONTAINER -->
      <div id="feedPosts" class="space-y-6"></div>

    </main>

    <!-- RIGHT SIDEBAR (SWITCH ACCOUNT & SUGGESTIONS) -->
    <aside class="hidden lg:block w-80 space-y-6 pt-2">
      <!-- Switch Account Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <img src="https://i.pravatar.cc/100?img=33" class="w-12 h-12 rounded-full border border-slate-700">
          <div>
            <p class="text-xs font-bold text-slate-100">oron.broh</p>
            <p class="text-[11px] text-slate-400">Oronno 🐯</p>
          </div>
        </div>
        <a href="login.html" class="text-xs font-bold text-cyan-400 hover:underline">Switch</a>
      </div>

      <!-- Suggestions Header -->
      <div class="flex justify-between items-center text-xs">
        <span class="font-bold text-slate-400">Suggested for you</span>
        <button class="font-bold text-slate-200 hover:underline">See all</button>
      </div>

      <!-- Suggested Users List -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <img src="https://i.pravatar.cc/100?img=5" class="w-9 h-9 rounded-full">
            <div>
              <p class="text-xs font-bold text-slate-200">MUHAIMINUL KAWSAR</p>
              <p class="text-[10px] text-slate-400">Followed by adeeb_1st</p>
            </div>
          </div>
          <button class="text-xs font-bold text-cyan-400 hover:text-white">Follow</button>
        </div>

        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <img src="https://i.pravatar.cc/100?img=9" class="w-9 h-9 rounded-full">
            <div>
              <p class="text-xs font-bold text-slate-200">Scarlet Williams</p>
              <p class="text-[10px] text-slate-400">Suggested for you</p>
            </div>
          </div>
          <button class="text-xs font-bold text-cyan-400 hover:text-white">Follow</button>
        </div>
      </div>
    </aside>

  </div>

  <!-- FLOATING MESSAGES WIDGET (3rd Image IG Bottom Widget) -->
  <div class="fixed bottom-4 right-6 z-50 flex items-center space-x-3 bg-slate-900/90 border border-slate-700/80 px-4 py-2.5 rounded-full backdrop-blur-md shadow-2xl cursor-pointer hover:bg-slate-800 transition" onclick="location.href='messages.html'">
    <div class="relative">
      <i class="fa-regular fa-paper-plane text-cyan-400 text-lg"></i>
      <span class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.2 rounded-full">4</span>
    </div>
    <span class="text-xs font-bold text-slate-100">Messages</span>
    <div class="flex -space-x-2 overflow-hidden pl-2 border-l border-slate-700">
      <img class="inline-block h-5 w-5 rounded-full ring-2 ring-slate-900" src="https://i.pravatar.cc/100?img=1" />
      <img class="inline-block h-5 w-5 rounded-full ring-2 ring-slate-900" src="https://i.pravatar.cc/100?img=2" />
      <img class="inline-block h-5 w-5 rounded-full ring-2 ring-slate-900" src="https://i.pravatar.cc/100?img=3" />
    </div>
  </div>

</body>
</html>
