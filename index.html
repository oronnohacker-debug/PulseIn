<!DOCTYPE html>
<html lang="en"> <!-- 'dark' ক্লাসটি সরিয়ে দিয়েছি -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PulseIn — Theme Switcher</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <script>
    // থিম টগল করার ফাংশন
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }
    
    // Tailwind Config
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, onSnapshot, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ... (তোমার আগের ফায়ারবেস কনফিগ এবং ফাংশনগুলো এখানে থাকবে) ...
    // আমি শুধু লেআউটের জন্য থিম সাপোর্ট যোগ করেছি।
    
    // বাকি সব logic আগের মতোই থাকবে।
  </script>
</head>

<!-- Body-তে ব্যাকগ্রাউন্ড এবং টেক্সট লাইট/ডার্ক মোড অনুযায়ী সেট করা হয়েছে -->
<body class="bg-white dark:bg-black text-black dark:text-slate-100 min-h-screen font-sans select-none">

  <!-- LEFT SIDEBAR -->
  <aside class="hidden md:flex w-64 fixed top-0 left-0 h-screen bg-white dark:bg-black border-r border-neutral-200 dark:border-neutral-800 flex-col justify-between p-4 z-50">
    <div class="space-y-8">
      <div class="px-2 pt-2"><img src="logo.png" alt="Logo" class="h-8 w-auto"></div>

      <nav class="space-y-4 text-sm font-medium">
        <!-- থিম টগল বাটন -->
        <button onclick="toggleTheme()" class="w-full flex items-center space-x-4 p-2.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-900">
          <i class="fa-solid fa-circle-half-stroke text-xl"></i><span>Switch Theme</span>
        </button>

        <a href="index.html" class="flex items-center space-x-4 p-2.5 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-900 font-bold">
          <i class="fa-solid fa-house text-xl"></i><span>Home</span>
        </a>
        <!-- বাকি মেনুগুলো আগের মতোই -->
      </nav>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <main class="md:ml-64 p-4">
    <!-- এখানে তোমার পোস্ট এবং ফিড আগের মতোই কাজ করবে -->
    <div id="feedPostsContainer" class="max-w-[470px] mx-auto"></div>
  </main>

</body>
</html>
